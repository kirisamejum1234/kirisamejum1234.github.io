:root{
  --dark:#232323; --blue:#1e1ed2; --beige:#eae3d3; --page:#ededed;
  --slate:#5f6d75; --key:#151515; --yellow:#f5e900; --red:#e60012;
  --orange:#f08a2e; --pink:#e0309a; --greencat:#17b83a; --cleared:#8fd18a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","UD デジタル 教科書体","Klee One","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--page);color:#111;overscroll-behavior:none;}
.num{font-family:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","UD デジタル 教科書体","Klee One",sans-serif;}
button{font-family:inherit;cursor:pointer;border:2px outset #ddd;border-radius:4px;}
button:active{filter:brightness(1.25);}
.screen{display:none;min-height:100dvh;flex-direction:column;}
.screen.active{display:flex;}
/* ---- 選択画面共通 ---- */
.beige{background:var(--beige);}
.header{background:var(--dark);color:#fff;text-align:center;font-weight:bold;
  font-size:clamp(26px,6vw,40px);padding:22px 8px;}
.prompt{color:#2020a0;font-weight:bold;font-size:clamp(14px,3.6vw,16px);padding:14px 20px 4px;}
.footer{margin-top:auto;display:flex;align-items:center;padding:8px 12px;gap:12px;}
.ver{color:#999;font-size:11px;}
.spacer{flex:1;}
.btn-dark{background:var(--dark);color:#fff;font-weight:bold;font-size:16px;padding:10px 26px;}
.btn-dark:active{background:#444;}
/* ---- 段選択 ---- */
.dan-panel{margin:6px 14px 14px;background:var(--blue);border:2px ridge #999;
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;}
.dan-btn{background:var(--slate);color:#fff;font-weight:bold;
  font-size:clamp(20px,5.4vw,28px);min-height:64px;}
.dan-btn:active{background:var(--yellow);color:#000;}
/* ---- 順序選択 ---- */
.order-area{flex:1;display:flex;gap:10px;padding:6px 14px 14px;}
.order-cell{flex:1;display:flex;flex-direction:column;}
.order-btn{flex:1;color:#fff;font-weight:bold;font-size:clamp(19px,5vw,28px);min-height:110px;}
.order-btn:active{background:var(--yellow);color:#000;}
.order-desc{text-align:center;color:#333;font-size:clamp(11px,3vw,13px);padding:8px 2px;}
.order-btn.selected{background:var(--yellow) !important;color:#000;}
.time-label{color:#2020a0;font-weight:bold;font-size:clamp(14px,3.6vw,16px);padding:12px 20px 4px;}
.time-modes{display:flex;gap:10px;padding:2px 14px;}
.tm-btn{flex:0 1 240px;background:var(--slate);color:#fff;font-weight:bold;font-size:clamp(16px,4.4vw,20px);padding:10px 0;}
.tm-btn.selected{background:var(--yellow);color:#000;}
.step-row{display:flex;flex-wrap:wrap;gap:18px;padding:10px 14px 0;align-items:center;}
.step-group{display:flex;align-items:center;gap:4px;}
.step-btn{background:var(--slate);color:#fff;font-weight:bold;font-size:clamp(14px,4vw,17px);padding:10px 12px;user-select:none;-webkit-user-select:none;}
.step-btn:disabled{background:#b9b9b9;color:#eee;}
.step-val{background:#fff;border:1px solid #888;min-width:52px;text-align:center;font-size:clamp(22px,6vw,28px);padding:2px 4px;}
.step-unit{font-weight:bold;font-size:clamp(16px,4.4vw,19px);}
.time-warn{color:var(--red);font-weight:bold;padding:6px 20px 0;min-height:24px;font-size:clamp(13px,3.6vw,15px);}
.btn-start{background:var(--red);color:#fff;font-weight:bold;font-size:clamp(17px,4.8vw,20px);padding:10px 30px;}
.timer-label{margin-left:auto;color:#2020a0;font-weight:bold;font-size:clamp(15px,4.4vw,19px);}
.main-area{flex:1;display:flex;gap:10px;padding:6px 14px 14px;}
.main-btn{flex:1;color:#fff;font-weight:bold;font-size:clamp(28px,8vw,42px);}
.main-btn:active{background:var(--yellow);color:#000;}
.mode-tag{margin-left:14px;}
.verdict{display:none;text-align:center;font-weight:bold;font-size:clamp(24px,6.4vw,34px);line-height:1.4;padding:16px 8px 0;}
.verdict.pass{display:block;color:#1d7a1d;}
.verdict.fail{display:block;color:var(--red);}
.settings-text{color:#333;font-weight:bold;font-size:clamp(14px,4vw,17px);line-height:1.5;}
.exam-time{display:none;padding:2px 14px;}
.exam-time .fixed{background:var(--yellow);font-weight:bold;font-size:clamp(17px,4.8vw,21px);padding:10px 18px;display:inline-block;}
.exam-time .note{color:#333;font-size:clamp(12px,3.4vw,14px);margin-left:10px;}
/* ---- 計算画面 ---- */
#scr-calc{background:var(--page);padding:6px 8px calc(8px + env(safe-area-inset-bottom));}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 6px;align-items:center;}
.tab{background:#cfcfcf;color:#222;font-size:clamp(16px,4.6vw,21px);min-width:44px;padding:5px 0;}
.tab.current{background:var(--yellow);}
.tab.cleared{background:var(--cleared);}
.naoshi-tag{color:var(--red);font-weight:bold;font-size:18px;margin-left:10px;}
.calc-main{flex:1;display:flex;gap:8px;min-height:0;}
.calc-left{flex:7;display:flex;flex-direction:column;padding:4px 2px 0 8px;min-width:0;}
.problem{font-size:clamp(32px,9vw,52px);line-height:1.15;padding:6px 0 8px;white-space:nowrap;}
.problem .sym{font-weight:bold;font-size:.92em;}
.input-box{background:#fff;border:1px solid #888;min-height:clamp(58px,14vw,84px);
  display:flex;align-items:center;padding:0 12px;font-size:clamp(32px,9vw,52px);}
.status{color:var(--red);font-weight:bold;font-size:clamp(15px,4.4vw,19px);
  padding-top:10px;min-height:32px;}
.saiten{align-self:flex-start;margin-top:auto;background:var(--red);color:#fff;font-weight:bold;
  font-size:clamp(20px,5.6vw,27px);padding:12px 44px;display:none;}
.saiten.show{display:block;}
.keypad{flex:0 0 38%;max-width:350px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));gap:5px;}
.keypad button{min-width:0;min-height:0;}
.key{background:var(--key);color:#fff;font-size:clamp(22px,6.4vw,32px);border-color:#555;}
.key:active{background:#444;}
.key-func{background:#fff;color:var(--red);font-weight:bold;font-size:clamp(11px,3.2vw,14px);line-height:1.25;}
.key-func:active{background:#ffecec;}
.key-ok{background:var(--blue);color:#fff;font-weight:bold;font-size:clamp(18px,5vw,23px);grid-column:2/4;}
.key-ok:active{background:#4040ff;}
.key-top{background:var(--dark);color:#fff;font-weight:bold;font-size:clamp(12px,3.6vw,16px);visibility:hidden;}
.key-top.show{visibility:visible;}
/* ---- 結果画面 ---- */
#scr-result{background:var(--page);padding:20px 16px calc(14px + env(safe-area-inset-bottom));}
.result-main{flex:1;display:flex;gap:14px;min-height:0;}
.result-left{flex:0 0 34%;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:6px;}
.score{font-size:clamp(24px,6.4vw,34px);font-weight:bold;}
.elapsed{font-size:clamp(20px,5.6vw,29px);font-weight:bold;}
.naoshi-note{color:#2020a0;font-weight:bold;font-size:clamp(14px,4vw,17px);}
.done-note{color:#1d7a1d;font-weight:bold;font-size:clamp(14px,4vw,17px);}
.btn-naoshi{background:var(--red);color:#fff;font-weight:bold;font-size:clamp(18px,5vw,23px);padding:10px 32px;}
.btn-result-ok{background:#fff;color:#111;font-weight:bold;font-size:clamp(19px,5.4vw,25px);padding:8px 44px;}
.result-right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.list-title{color:#2020a0;font-weight:bold;font-size:clamp(18px,5vw,23px);}
.list-sub{color:var(--red);font-weight:bold;font-size:clamp(15px,4.4vw,19px);padding:2px 0 8px;}
.list-line{font-size:clamp(20px,5.8vw,28px);line-height:1.35;white-space:nowrap;}
#resultList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.list-line .sym{font-weight:bold;font-size:.9em;}
.list-line.wrong{color:var(--red);}
.list-sep{color:#888;font-size:15px;padding:2px 0;}
@media (max-width:560px){
  .result-main{flex-direction:column;}
  .result-left{flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;}
}
</style>
</head>
<body>

<!-- 0) メイン画面 -->
<div id="scr-main" class="screen beige active">
  <div class="header">くくダッシュ</div>
  <div class="main-area">
    <button class="main-btn" style="background:var(--greencat)" id="btnPractice">れんしゅう</button>
    <button class="main-btn" style="background:var(--pink)" id="btnExam">しけん</button>
  </div>
  <div class="footer">
    <span class="ver">ver. 20261110-14</span>
  </div>
</div>

<!-- 1) 段選択 -->
<div id="scr-dan" class="screen beige">
  <div class="header">くくダッシュ</div>
  <div class="prompt">何のだんにしますか<span class="mode-tag" id="danModeTag"></span></div>
  <div class="dan-panel" id="danPanel"></div>
  <div class="footer">
    <span class="ver">ver. 20261110-14</span>
    <span class="spacer"></span>
    <button class="btn-dark" id="btnClose">もどる</button>
  </div>
</div>

<!-- 2) 順序選択 -->
<div id="scr-order" class="screen beige">
  <div class="header" id="orderTitle">○ のだん</div>
  <div class="prompt">じゅんばんを選んでください</div>
  <div class="order-area" style="flex:none">
    <div class="order-cell">
      <button class="order-btn" style="background:var(--slate)" data-order="junban">じゅんばん</button>
      <div class="order-desc" id="descJunban"></div>
    </div>
    <div class="order-cell">
      <button class="order-btn" style="background:var(--slate)" data-order="gyaku">ぎゃくじゅん</button>
      <div class="order-desc" id="descGyaku"></div>
    </div>
    <div class="order-cell">
      <button class="order-btn" style="background:var(--slate)" data-order="random">ランダム</button>
      <div class="order-desc" id="descRandom">バラバラの順</div>
    </div>
  </div>
  <div class="step-row" id="countRow" style="display:none">
    <span class="step-unit" style="font-weight:bold;color:#2020a0;font-size:19px">もんだい数</span>
    <div class="step-group">
      <button class="step-btn" data-count="-10">−10</button>
      <button class="step-btn" data-count="-1">−1</button>
      <span class="step-val num" id="qCountVal">20</span><span class="step-unit">問</span>
      <button class="step-btn" data-count="1">＋1</button>
      <button class="step-btn" data-count="10">＋10</button>
    </div>
  </div>
  <div class="time-label">タイム計測</div>
  <div class="exam-time" id="examTimeRow"><span class="fixed" id="examTimeTxt">カウントダウン 1分</span><span class="note" id="examNoteTxt">しけんは1分固定です</span></div>
  <div class="time-modes" id="tmModes">
    <button class="tm-btn" id="tmUp">カウントアップ</button>
    <button class="tm-btn" id="tmDown">カウントダウン</button>
  </div>
  <div class="step-row" id="stepRow">
    <div class="step-group">
      <button class="step-btn" data-step="min:-1">−1</button>
      <span class="step-val num" id="cdMinVal">1</span><span class="step-unit">分</span>
      <button class="step-btn" data-step="min:1">＋1</button>
    </div>
    <div class="step-group">
      <button class="step-btn" data-step="sec:-10">−10</button>
      <button class="step-btn" data-step="sec:-1">−1</button>
      <span class="step-val num" id="cdSecVal">0</span><span class="step-unit">秒</span>
      <button class="step-btn" data-step="sec:1">＋1</button>
      <button class="step-btn" data-step="sec:10">＋10</button>
    </div>
  </div>
  <div class="time-warn" id="timeWarn"></div>
  <div class="footer">
    <span class="ver">ver. 20261110-14</span>
    <span class="spacer"></span>
    <button class="btn-start" id="btnStart">スタート</button>
    <button class="btn-dark" id="btnOrderBack">もどる</button>
  </div>
</div>

<!-- 3) 計算画面 -->
<div id="scr-calc" class="screen">
  <div style="display:flex;align-items:center"><div class="tabs" id="tabs" style="flex:1"></div><span class="timer-label" id="timerLabel"></span></div>
  <div class="calc-main">
    <div class="calc-left">
      <div class="problem"><span class="num" id="probDan"></span><span class="sym"> × </span><span class="num" id="probK"></span><span class="sym"> =</span></div>
      <div class="input-box num" id="inputBox"></div>
      <div class="status" id="status"></div>
      <button class="saiten" id="btnSaiten">採点</button>
    </div>
    <div class="keypad" id="keypad">
      <button class="key num" data-digit="7">7</button>
      <button class="key num" data-digit="8">8</button>
      <button class="key num" data-digit="9">9</button>
      <button class="key num" data-digit="4">4</button>
      <button class="key num" data-digit="5">5</button>
      <button class="key num" data-digit="6">6</button>
      <button class="key num" data-digit="1">1</button>
      <button class="key num" data-digit="2">2</button>
      <button class="key num" data-digit="3">3</button>
      <button class="key num" data-digit="0">0</button>
      <button class="key-func" id="btnBack">←<br>1つけす</button>
      <button class="key-func" id="btnAC">AC<br>全部けす</button>
      <button class="key-top" id="btnTop">トップへ</button>
      <button class="key-ok" id="btnOK">OK</button>
    </div>
  </div>
</div>

<!-- 4) 結果画面 -->
<div id="scr-result" class="screen">
  <div class="verdict" id="verdict"></div>
  <div class="result-main">
    <div class="result-left">
      <div class="score" id="scoreText"></div>
      <div class="elapsed" id="elapsedText"></div>
      <div class="settings-text" id="settingsText"></div>
      <div class="naoshi-note" id="naoshiNote">なおしボタンを押してね！</div>
      <div class="done-note" id="doneNote" style="display:none">なおしが終わりました！</div>
      <button class="btn-naoshi" id="btnNaoshi">なおし</button>
      <button class="btn-result-ok" id="btnResultOK">OK</button>
    </div>
    <div class="result-right">
      <div class="list-title">問題リスト</div>
      <div class="list-sub">間違えた問題は赤字</div>
      <div id="resultList"></div>
    </div>
  </div>
</div>

<script>
"use strict";
var APP_VERSION = "20261110-6";
var S = {
  dan: null, order: null, mode: "normal",
  items: [], answers: [], idx: 0, input: "",
  acCount: 0, topVisible: false, finished: false,
  startTime: 0, elapsed: null, naoshiCompleted: false,
  naoshiCleared: new Set(), naoshiDrafts: {},
  resultItems: [], resultAnswers: [], resultScore: 0, resultWrong: [],
  selOrder: "junban", timeMode: "up", cdMin: 1, cdSec: 0,
  playMode: "practice", qCount: 20,
  timeLimit: null, timeUp: false, timerId: null
};
function $(id){ return document.getElementById(id); }
function show(id){
  document.querySelectorAll(".screen").forEach(function(el){ el.classList.remove("active"); });
  $(id).classList.add("active");
}
function formatElapsed(sec){
  var cs = Math.floor(sec * 100);
  var m = Math.floor(cs / 6000), r = cs % 6000;
  var s = Math.floor(r / 100), c = r % 100;
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(m) + "分" + p(s) + "秒" + p(c);
}
/* ---------- 段選択 ---------- */
(function buildDan(){
  var panel = $("danPanel");
  for (var d = 1; d <= 9; d++){
    var b = document.createElement("button");
    b.className = "dan-btn"; b.textContent = d + " のだん";
    (function(dan){ b.addEventListener("click", function(){ selectDan(dan); }); })(d);
    panel.appendChild(b);
  }
  var zb = document.createElement("button");
  zb.className = "dan-btn"; zb.textContent = "ぜんぶ";
  zb.style.gridColumn = "1 / -1"; zb.style.background = "var(--orange)";
  zb.style.color = "#fff";
  zb.addEventListener("click", function(){ selectDan("all"); });
  panel.appendChild(zb);
})();
function selectDan(d){
  S.dan = d;
  if (d === "all"){
    $("orderTitle").textContent = "ぜんぶ";
    $("descJunban").textContent = "1×1 から 9×9 の順（81問）";
    $("descGyaku").textContent = "9×9 から 1×1 の順（81問）";
    $("descRandom").textContent = "バラバラの順（問題数を選べます）";
  } else {
    $("orderTitle").textContent = d + " のだん";
    $("descJunban").textContent = d + "×1 から " + d + "×9 の順";
    $("descGyaku").textContent = d + "×9 から " + d + "×1 の順";
    $("descRandom").textContent = "バラバラの順";
  }
  refreshOrderUI();
  show("scr-order");
}
$("btnOrderBack").addEventListener("click", function(){ show("scr-dan"); });
$("btnClose").addEventListener("click", function(){ show("scr-main"); });
function enterMode(m){
  S.playMode = m;
  var tag = $("danModeTag");
  tag.textContent = m === "exam" ? "しけん" : "れんしゅう";
  tag.style.color = m === "exam" ? "#e60012" : "#2020a0";
  refreshOrderUI();
  show("scr-dan");
}
$("btnPractice").addEventListener("click", function(){ enterMode("practice"); });
$("btnExam").addEventListener("click", function(){ enterMode("exam"); });
document.querySelectorAll("[data-order]").forEach(function(b){
  b.addEventListener("click", function(){
    S.selOrder = b.getAttribute("data-order"); refreshOrderUI();
  });
});
$("tmUp").addEventListener("click", function(){ S.timeMode = "up"; refreshOrderUI(); });
$("tmDown").addEventListener("click", function(){ S.timeMode = "down"; refreshOrderUI(); });
function examLimit(){
  if (S.dan === "all"){
    return S.selOrder === "random" ? S.qCount * 6 : 8 * 60;
  }
  return 60;
}
function refreshOrderUI(){
  var exam = S.playMode === "exam";
  $("examTimeRow").style.display = exam ? "block" : "none";
  $("countRow").style.display =
    (S.dan === "all" && S.selOrder === "random") ? "flex" : "none";
  $("qCountVal").textContent = S.qCount;
  if (S.dan === "all" && S.selOrder === "random"){
    var sec = S.qCount * 6;
    $("examTimeTxt").textContent =
      "カウントダウン " + Math.floor(sec / 60) + "分" + (sec % 60) + "秒";
    $("examNoteTxt").textContent = S.qCount + "問 × 6秒 で計算しています";
  } else if (S.dan === "all"){
    $("examTimeTxt").textContent = "カウントダウン 8分";
    $("examNoteTxt").textContent = "81問・しけんは8分固定です";
  } else {
    $("examTimeTxt").textContent = "カウントダウン 1分";
    $("examNoteTxt").textContent = "しけんは1分固定です";
  }
  $("tmModes").style.display = exam ? "none" : "flex";
  $("stepRow").style.display = exam ? "none" : "flex";
  document.querySelectorAll("[data-order]").forEach(function(b){
    b.classList.toggle("selected", b.getAttribute("data-order") === S.selOrder);
  });
  $("tmUp").classList.toggle("selected", S.timeMode === "up");
  $("tmDown").classList.toggle("selected", S.timeMode === "down");
  $("cdMinVal").textContent = S.cdMin;
  $("cdSecVal").textContent = S.cdSec;
  var en = S.timeMode === "down";
  document.querySelectorAll("[data-step]").forEach(function(b){ b.disabled = !en; });
  $("timeWarn").textContent = "";
}
function stepCount(delta){
  S.qCount = Math.min(100, Math.max(10, S.qCount + delta));
  refreshOrderUI();
}
document.querySelectorAll("[data-count]").forEach(function(b){
  var delta = parseInt(b.getAttribute("data-count"), 10);
  var t1 = null, t2 = null;
  function clearTimers(){ if (t1){ clearTimeout(t1); t1 = null; } if (t2){ clearInterval(t2); t2 = null; } }
  b.addEventListener("pointerdown", function(e){
    e.preventDefault();
    stepCount(delta);
    t1 = setTimeout(function(){ t2 = setInterval(function(){ stepCount(delta); }, 90); }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function(ev){
    b.addEventListener(ev, clearTimers);
  });
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
});
function stepCd(which, delta){
  if (which === "min") S.cdMin = Math.min(99, Math.max(0, S.cdMin + delta));
  else S.cdSec = Math.min(59, Math.max(0, S.cdSec + delta));
  refreshOrderUI();
}
document.querySelectorAll("[data-step]").forEach(function(b){
  var parts = b.getAttribute("data-step").split(":");
  var which = parts[0], delta = parseInt(parts[1], 10);
  var t1 = null, t2 = null;
  function clearTimers(){ if (t1){ clearTimeout(t1); t1 = null; } if (t2){ clearInterval(t2); t2 = null; } }
  b.addEventListener("pointerdown", function(e){
    if (b.disabled) return;
    e.preventDefault();
    stepCd(which, delta);
    t1 = setTimeout(function(){ t2 = setInterval(function(){ stepCd(which, delta); }, 90); }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function(ev){
    b.addEventListener(ev, clearTimers);
  });
});
$("btnStart").addEventListener("click", function(){
  if (S.playMode === "exam"){ startSession(S.selOrder); return; }
  if (S.timeMode === "down" && S.cdMin * 60 + S.cdSec <= 0){
    $("timeWarn").textContent = "カウントダウンの時間を決めてください";
    return;
  }
  startSession(S.selOrder);
});
refreshOrderUI();
/* ---------- セッション ---------- */
function shuffleArr(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function startSession(order){
  S.order = order;
  var combos = [];
  if (S.dan === "all"){
    for (var d = 1; d <= 9; d++)
      for (var k = 1; k <= 9; k++) combos.push([d, k]);
    if (order === "gyaku") combos.reverse();
    else if (order === "random"){
      var picked = [];
      while (picked.length < S.qCount){
        picked = picked.concat(shuffleArr(combos.slice()));
      }
      combos = picked.slice(0, S.qCount);
    }
  } else {
    var ks = [1,2,3,4,5,6,7,8,9];
    if (order === "gyaku") ks.reverse();
    if (order === "random") shuffleArr(ks);
    combos = ks.map(function(k){ return [S.dan, k]; });
  }
  S.items = combos.map(function(c, pos){
    return { orig: pos + 1, dan: c[0], k: c[1] };
  });
  S.answers = S.items.map(function(){ return null; });
  S.mode = "normal"; S.idx = 0; S.input = "";
  S.acCount = 0; S.topVisible = false; S.finished = false;
  S.elapsed = null; S.naoshiCompleted = false;
  S.timeLimit = S.playMode === "exam" ? examLimit()
    : (S.timeMode === "down" ? S.cdMin * 60 + S.cdSec : null);
  S.timeUp = false;
  S.startTime = Date.now();
  show("scr-calc"); renderCalc(); startTimer();
}
function mmss(sec){
  sec = Math.max(0, Math.floor(sec));
  return (sec < 600 ? "0" : "") + Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
}
function startTimer(){
  stopTimer();
  S.timerId = setInterval(updateTimer, 100);
  updateTimer();
}
function stopTimer(){
  if (S.timerId){ clearInterval(S.timerId); S.timerId = null; }
}
function updateTimer(){
  if (S.mode !== "normal" || S.finished) return;
  var elapsed = (Date.now() - S.startTime) / 1000;
  if (S.timeLimit === null){
    $("timerLabel").textContent = "時間 " + mmss(elapsed);
  } else {
    var remain = S.timeLimit - elapsed;
    if (remain <= 0){
      S.finished = true; S.timeUp = true;
      S.elapsed = S.timeLimit; S.input = "";
      showResult();
      return;
    }
    $("timerLabel").textContent = "残り " + mmss(Math.ceil(remain));
  }
}
function startNaoshi(){
  if (!S.resultWrong.length) return;
  stopTimer(); $("timerLabel").textContent = "";
  S.items = S.resultWrong.slice();
  S.mode = "naoshi";
  S.naoshiCleared = new Set(); S.naoshiDrafts = {};
  S.idx = 0; S.input = ""; S.acCount = 0; S.topVisible = false; S.finished = false;
  show("scr-calc"); renderCalc();
}
function currentAnswer(){ var it = S.items[S.idx]; return it.dan * it.k; }
function renderCalc(){
  var tabs = $("tabs"); tabs.innerHTML = "";
  S.items.forEach(function(it, i){
    var b = document.createElement("button");
    b.className = "tab num" + (i === S.idx ? " current" : "")
      + (S.mode === "naoshi" && S.naoshiCleared.has(i) ? " cleared" : "");
    b.textContent = it.orig;
    b.addEventListener("click", function(){ gotoQuestion(i); });
    tabs.appendChild(b);
  });
  if (S.mode === "naoshi"){
    var tag = document.createElement("span");
    tag.className = "naoshi-tag"; tag.textContent = "なおし";
    tabs.appendChild(tag);
  }
  $("probDan").textContent = S.items[S.idx].dan;
  $("probK").textContent = S.items[S.idx].k;
  $("inputBox").textContent = S.input;
  $("btnTop").classList.toggle("show", S.topVisible);
  $("btnSaiten").classList.toggle("show", S.mode === "normal" && S.finished);
}
function gotoQuestion(j){
  if (j === S.idx || j < 0 || j >= S.items.length) return;
  if (S.mode === "normal" && S.timeUp) return;
  if (S.mode === "naoshi"){
    S.naoshiDrafts[S.idx] = S.input;
    S.idx = j;
    S.input = S.naoshiCleared.has(j) ? String(currentAnswer()) : (S.naoshiDrafts[j] || "");
    $("status").textContent = "";
    renderCalc(); return;
  }
  S.answers[S.idx] = S.input === "" ? null : parseInt(S.input, 10);
  S.idx = j;
  var saved = S.answers[j];
  S.input = saved === null ? "" : String(saved);
  S.finished = false; S.elapsed = null;
  $("status").textContent = "";
  renderCalc();
}
/* ---------- キー操作 ---------- */
function pressDigit(d){
  if (S.mode === "normal" && S.finished) return;
  if (S.input.length >= 6) return;
  S.input = (S.input === "" && d === "0") ? "0" : S.input + d;
  S.acCount = 0;
  $("status").textContent = "";
  $("inputBox").textContent = S.input;
}
function pressBack(){
  S.input = S.input.slice(0, -1);
  S.acCount = 0;
  $("inputBox").textContent = S.input;
}
function pressAC(){
  S.input = ""; $("inputBox").textContent = "";
  S.acCount += 1;
  if (S.acCount >= 5 && !S.topVisible){
    S.topVisible = true;
    $("btnTop").classList.add("show");
  }
}
function pressOK(){
  if (S.mode === "naoshi"){ okNaoshi(); return; }
  if (S.finished) return;
  S.answers[S.idx] = S.input === "" ? null : parseInt(S.input, 10);
  if (S.idx >= S.items.length - 1){
    S.finished = true;
    S.elapsed = (Date.now() - S.startTime) / 1000;
    S.input = "";
    renderCalc();
    return;
  }
  S.idx += 1;
  var saved = S.answers[S.idx];
  S.input = saved === null ? "" : String(saved);
  renderCalc();
}
function okNaoshi(){
  if (S.input === "") return;
  if (parseInt(S.input, 10) === currentAnswer()){
    S.naoshiCleared.add(S.idx);
    S.naoshiDrafts[S.idx] = S.input;
    S.input = ""; $("status").textContent = "";
    if (S.naoshiCleared.size >= S.items.length){
      S.naoshiCompleted = true;
      showResult(); return;
    }
    for (var step = 1; step <= S.items.length; step++){
      var cand = (S.idx + step) % S.items.length;
      if (!S.naoshiCleared.has(cand)){ S.idx = cand; break; }
    }
    S.input = S.naoshiDrafts[S.idx] || "";
    renderCalc();
  } else {
    S.input = ""; S.naoshiDrafts[S.idx] = "";
    $("inputBox").textContent = "";
    $("status").textContent = "ちがいます。もう一度！";
  }
}
document.querySelectorAll("[data-digit]").forEach(function(b){
  b.addEventListener("click", function(){ pressDigit(b.getAttribute("data-digit")); });
});
$("btnBack").addEventListener("click", pressBack);
$("btnAC").addEventListener("click", pressAC);
$("btnOK").addEventListener("click", pressOK);
$("btnTop").addEventListener("click", function(){ stopTimer(); show("scr-main"); });
$("btnSaiten").addEventListener("click", showResult);
/* ---------- 結果 ---------- */
function showResult(){
  stopTimer();
  if (S.mode === "normal"){
    S.resultItems = S.items.slice();
    S.resultAnswers = S.answers.slice();
    var wrong = [], score = 0;
    S.resultItems.forEach(function(it, i){
      var ans = S.resultAnswers[i];
      if (ans !== null && ans === it.dan * it.k) score++;
      else wrong.push(it);
    });
    S.resultScore = score; S.resultWrong = wrong;
  }
  var verdict = $("verdict");
  if (S.playMode === "exam"){
    var passed = S.resultScore === S.resultItems.length;
    verdict.className = "verdict " + (passed ? "pass" : "fail");
    verdict.innerHTML = passed
      ? "おめでとう！<br>ごうかくしました！<br>先生に見せてね！"
      : "ざんねん！<br>このつぎはがんばろう！";
  } else {
    verdict.className = "verdict"; verdict.textContent = "";
  }
  var orderNames = { junban: "じゅんばん", gyaku: "ぎゃくじゅん", random: "ランダム" };
  var timeName;
  if (S.playMode === "exam"){
    if (S.dan === "all" && S.order === "random"){
      var esec = S.qCount * 6;
      timeName = "カウントダウン " + Math.floor(esec / 60) + "分" + (esec % 60) + "秒";
    } else if (S.dan === "all") timeName = "カウントダウン 8分";
    else timeName = "カウントダウン 1分";
  } else {
    timeName = S.timeMode === "down" ? "カウントダウン " + S.cdMin + "分" + S.cdSec + "秒" : "カウントアップ";
  }
  var danText = S.dan === "all"
    ? "ぜんぶ" + (S.order === "random" ? " " + S.qCount + "問" : "")
    : S.dan + " のだん";
  $("settingsText").innerHTML = danText + "（" + (S.playMode === "exam" ? "しけん" : "れんしゅう") + "）<br>"
    + (orderNames[S.order] || "") + "／" + timeName;
  $("scoreText").textContent = S.resultScore + "点／" + S.resultItems.length + "点";
  $("elapsedText").textContent = formatElapsed(S.elapsed || 0);
  var hasWrong = S.resultWrong.length > 0;
  var showNaoshi = hasWrong && !S.naoshiCompleted && S.playMode !== "exam";
  $("naoshiNote").style.display = showNaoshi ? "" : "none";
  $("btnNaoshi").style.display = showNaoshi ? "" : "none";
  $("doneNote").style.display = S.naoshiCompleted ? "" : "none";
  var list = $("resultList"); list.innerHTML = "";
  var wrongSet = new Set(S.resultWrong.map(function(it){ return it.orig + ":" + it.dan + ":" + it.k; }));
  var half = Math.ceil(S.resultItems.length / 2);
  S.resultItems.forEach(function(it, i){
    if (i === half){
      var sep = document.createElement("div");
      sep.className = "list-sep"; sep.textContent = "- - - - - - - - - - - - - - - -";
      list.appendChild(sep);
    }
    var line = document.createElement("div");
    line.className = "list-line" + (wrongSet.has(it.orig + ":" + it.dan + ":" + it.k) ? " wrong" : "");
    var ans = S.resultAnswers[i];
    line.innerHTML = "";
    var s1 = document.createElement("span"); s1.className = "num"; s1.textContent = it.dan;
    var s2 = document.createElement("span"); s2.className = "sym"; s2.textContent = " × ";
    var s3 = document.createElement("span"); s3.className = "num"; s3.textContent = it.k;
    var s4 = document.createElement("span"); s4.className = "sym"; s4.textContent = " = ";
    var s5 = document.createElement("span"); s5.className = "num"; s5.textContent = (ans === null ? "" : ans);
    [s1, s2, s3, s4, s5].forEach(function(s){ line.appendChild(s); });
    list.appendChild(line);
  });
  show("scr-result");
}
$("btnNaoshi").addEventListener("click", startNaoshi);
$("btnResultOK").addEventListener("click", function(){
  show(S.playMode === "exam" ? "scr-main" : "scr-dan");
});
/* ---------- 物理キーボード（PC確認用・テンキー対応） ---------- */
document.addEventListener("keydown", function(e){
  if (!$("scr-calc").classList.contains("active")) return;
  var digit = null;
  if (/^[0-9]$/.test(e.key)) digit = e.key;
  else if (/^Numpad[0-9]$/.test(e.code || "")) digit = e.code.slice(6);
  if (digit !== null){ pressDigit(digit); e.preventDefault(); return; }
  if (e.key === "Backspace" || e.key === "Delete" || e.code === "NumpadDecimal"){
    if (e.key !== "Delete" || e.code === "NumpadDecimal") { /* NumpadDecimal=消去扱い */ }
    pressBack(); e.preventDefault(); return;
  }
  if (e.key === "Enter" || e.code === "NumpadEnter"){ pressOK(); e.preventDefault(); }
});
window.__KD = { S: S, selectDan: selectDan, startSession: startSession,
  startNaoshi: startNaoshi, pressDigit: pressDigit, pressBack: pressBack,
  pressAC: pressAC, pressOK: pressOK, gotoQuestion: gotoQuestion,
  showResult: showResult, formatElapsed: formatElapsed,
  stepCd: stepCd, refreshOrderUI: refreshOrderUI, mmss: mmss,
  enterMode: enterMode };
window.__APP_OK__ = true;
</script>
