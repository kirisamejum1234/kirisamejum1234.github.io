  .numfont { font-family:"abacus2","UD Digi Kyokasho NP-R","UD デジタル 教科書体 NP-R","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","UD Digi Kyokasho","UD デジタル 教科書体","HG教科書体","YuKyokasho","Klee One","Hiragino Sans",sans-serif; }
  .screen { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .screen.active { display:flex; }
  h1 { font-size:32px; margin-bottom:24px; }
  /* 設定 */
  .form { width:min(92vw,420px); }
  .row { display:flex; align-items:center; justify-content:space-between; margin:12px 0; gap:10px; }
  .row label { font-size:15px; flex:1; }
  .row input[type=number], .row input[type=text], .row select {
    width:110px; padding:10px; font-size:17px; text-align:center;
    background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:8px;
  }
  .note { font-size:11px; color:#999; }
  /* 数値の上下ボタン（ステッパー） */
  .stepper { display:flex; align-items:center; gap:6px; flex:none; }
  .stepbtn { width:44px; height:44px; flex:none; font-size:22px; line-height:1;
    background:#263238; color:#fff; border:1px solid #455a64; border-radius:10px; cursor:pointer;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .stepbtn:disabled { opacity:.3; cursor:default; }
  .row .stepper input { width:64px; }
  .check { display:flex; gap:10px; align-items:flex-start; margin:14px 0; font-size:13px; line-height:1.5; }
  .check input { width:22px; height:22px; margin-top:2px; accent-color:#00b84f; }
  button {
    border:none; border-radius:10px; padding:14px 22px; font-size:16px;
    background:#1c1c1c; color:#fff; cursor:pointer; font-family:inherit;
  }
  button.primary { background:#00b84f; color:#fff; font-weight:bold; font-size:18px; padding:14px 40px; }
  button:active { opacity:.75; }
  .btnrow-settings { display:flex; gap:12px; justify-content:center; margin-top:26px; }
  /* 数字表示 */
  #flashScreen, #countScreen { padding:0; }
  .circle-wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .oval {
    border:5px solid #00b84f; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    padding:4vh 6vw; max-width:92vw;
  }
  #flashOval { border:none; padding:0; }  /* 計算に使う数字は丸で囲まない（丸はカウントダウンのみ） */
  #flashStage { position:relative; width:100%; height:100%; }
  .flash-cell { position:absolute; transform:translate(-50%,-50%); text-align:center; white-space:nowrap; visibility:hidden; color:#00b84f; font-weight:bold; }
  #answerGrid { margin:18px 0 26px; max-width:96vw; }
  .ans-block { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .ans-label { color:#9e9e9e; font-size:14px; font-weight:bold; }
  .ans-minus { font-size:20px; padding:0 14px; flex:0 0 auto; }
  #flashNum, #countNum {
    color:#00b84f; font-weight:bold; line-height:1.05; white-space:nowrap;
  }
  #flashNum { font-size:26vw; }
  #countNum { font-size:32vmin; }
  /* カウントダウンの丸は幅=高さの真円にする（楕円にしない） */
  #countOval { width:66vmin; height:66vmin; padding:0; flex:none; }
  /* 解答入力 */
  #answerInput {
    width:100%; min-width:0; padding:14px; font-size:40px; text-align:center;
    background:#1a1a1a; color:#00b84f; border:1px solid #333; border-radius:10px; margin:18px 0 26px;
  }
  /* 判定 */
  .mark { font-size:120px; font-weight:bold; line-height:1.1; }
  .mark.ok { color:#00b84f; } .mark.ng { color:#ff5252; }
  .judge-detail { font-size:19px; line-height:1.9; margin-top:12px; text-align:center; }
  .judge-detail .val { font-size:30px; font-weight:bold; white-space:nowrap; }
  /* 判定画面の下部エリア: 「次へ」行と4ボタン行を縦に積むので絶対に重ならない */
  .bottom-area {
    position:fixed; left:0; right:0; bottom:0; background:#000; z-index:5;
  }
  .result-row { display:none; justify-content:flex-end; padding:10px 12px 0; }
  .bottom-buttons {
    display:flex; gap:8px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom)); background:#000;
  }
  .bottom-buttons button { flex:1; padding:14px 4px; font-size:14px; }
  #toResultBtn { background:#00b84f; font-weight:bold; padding:14px 30px; }
  /* リザルト */
  #resultScreen { justify-content:flex-start; overflow-y:auto; padding-top:34px; }
  /* 設定・解答・判定は、内容が画面の高さを超えると中央寄せのまま上下が切れて
     スクロールもできなくなる。スクロール可能にし、上下の auto マージンで
     「収まるときは中央寄せ、はみ出すときは上からスクロール」に切り替える */
  #settingsScreen, #answerScreen, #judgeScreen { justify-content:flex-start; overflow-y:auto; }
  #settingsScreen > :first-child, #answerScreen > :first-child, #judgeScreen > :first-child { margin-top:auto; }

<body>

<script>
"use strict";
const $ = id => document.getElementById(id);
const screens = ["settingsScreen","countScreen","flashScreen","answerScreen","judgeScreen","resultScreen"];
function show(id){ screens.forEach(s => $(s).classList.toggle("active", s === id)); }
/* ラジオの選択値（未選択の環境でも例外にせず既定値で返す） */
function checkedVal(name, fallback){
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : fallback;
}
/* 全角数字・記号を半角に直してから数値化する（日本語入力のまま打っても通るように） */
function zenNum(v){
  return String(v).replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
                  .replace(/．/g, ".").replace(/，/g, ",").replace(/－/g, "-").replace(/　/g, " ");
}
/* 数値の上下ボタン（ステッパー）: data-target の欄を data-step だけ増減する。
   直接入力も従来どおり可能。並列計算数は input イベント経由でレイアウトも追随する */
function setStepEnabled(id, on){
  document.querySelectorAll(`.stepbtn[data-target="${id}"]`).forEach(b => { b.disabled = !on; });
}
document.querySelectorAll(".stepbtn").forEach(btn => {
  const stepOnce = () => {
    const el = $(btn.dataset.target);
    if(!el || el.disabled || btn.disabled) return;
    const isFloat = btn.dataset.target === "seconds" || btn.dataset.target === "totalSeconds";
    let cur = parseFloat(zenNum(el.value));
    if(isNaN(cur)) cur = 0;
    let v = cur + parseFloat(btn.dataset.step);
    if(isFloat){
      v = Math.round(v * 100) / 100;
      if(v < 0.1) v = 0.1;
      el.value = String(v);
    } else {
      v = Math.round(v);
      const max = btn.dataset.target === "seriesCount" ? 12 : 99;
      if(v < 1) v = 1;
      if(v > max) v = max;
      el.value = String(v);
    }
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
  };
  /* タップで即1回、長押し（0.4秒〜）で連続。
     止める条件を多重化し、どういう離し方をしても止まるようにする:
     ボタン上での離上/キャンセル/キャプチャ喪失、画面のどこで離しても、
     アプリ切替(blur/非表示)、そして最大10秒のフェイルセーフ */
  let delayTimer = null, repeatTimer = null, lastPointerAt = 0, holdId = null;
  const stopRepeat = () => {
    if(delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
    if(repeatTimer){ clearInterval(repeatTimer); repeatTimer = null; }
    holdId = null;
  };
  btn.addEventListener("pointerdown", e => {
    if(btn.disabled || holdId !== null) return;   // 長押し中の二重開始を防ぐ
    holdId = e.pointerId;
    lastPointerAt = Date.now();
    if(btn.setPointerCapture){ try{ btn.setPointerCapture(e.pointerId); }catch(_){} }
    stepOnce();
    delayTimer = setTimeout(() => {
      repeatTimer = setInterval(() => {
        if(btn.disabled || !btn.isConnected || Date.now() - lastPointerAt > 10000) stopRepeat();
        else stepOnce();
      }, 70);
    }, 400);
  });
  const endHold = e => {
    if(e.type === "contextmenu") e.preventDefault();
    if(holdId === null || e.pointerId === holdId) stopRepeat();
  };
  ["pointerup", "pointercancel", "lostpointercapture", "pointerleave", "contextmenu"].forEach(t => btn.addEventListener(t, endHold));
  window.addEventListener("pointerup", stopRepeat);      // 画面のどこで離しても止まる
  window.addEventListener("pointercancel", stopRepeat);
  window.addEventListener("blur", stopRepeat);           // アプリ切替・割り込みでも止まる
  document.addEventListener("visibilitychange", () => { if(document.hidden) stopRepeat(); });
  btn.addEventListener("click", () => {
    if(Date.now() - lastPointerAt < 1000) return;  // pointerdown で処理済み（二重に増やさない）
    stepOnce();                                    // キーボード等からのクリック
  });
});
const intOf = id => parseInt(zenNum($(id).value), 10);
const floatOf = id => parseFloat(zenNum($(id).value));
/* 設定エラーは alert ではなく画面内に表示する。
   アプリ内ブラウザ等では alert が出ず「無反応」に見えることがあるため */
function startError(msg){
  const el = $("startError");
  if(el){
    el.textContent = "⚠ " + msg;
    el.style.display = "block";
    if(el.scrollIntoView) el.scrollIntoView({ block: "center" });
  }
  return null;
}
function clearStartError(){
  const el = $("startError");
  if(el) el.style.display = "none";
}

/* ---------- 効果音（Web Audioで合成） ---------- */
let actx = null;
function audio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
/* iPhone対策: ユーザーがボタンを触れた瞬間に音を解放しておく。
   これをしないとSafariの自動再生制限でカウントダウン音が鳴らないことがある */
function unlockAudio(){
  try{
    const ctx = audio();
    if(ctx.state === "suspended" || ctx.state === "interrupted") ctx.resume();
    const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource(); src.buffer = buf;
    src.connect(ctx.destination); src.start(0);
    loadFlashSound();   // 数字用WAVもこのタイミングで読み込んでおく
  }catch(e){}
}
function tone(freq, sec, {type="sine", vol=0.5, delay=0} = {}){
  try{
    const ctx = audio();
    const start = () => {
      const t0 = ctx.currentTime + delay + 0.01;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + sec);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + sec + 0.05);
    };
    if(ctx.state === "running") start();
    else ctx.resume().then(start).catch(start);
  }catch(e){}
}
document.addEventListener("pointerdown", unlockAudio);  // どのボタンを触っても音を有効化しておく
const beepCountdown = () => tone(1568, 0.22, {vol:0.55});     // 少し高め・ピー（カウントの切り替わりと同時）
/* 数字表示の音はユーザー指定のWAV（このHTMLに埋め込み）を使う。
   デコード前・失敗時は従来の合成音で代替する */
const FLASH_WAV_B64 = "UklGRnQEAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YU8EAACAgICAgICAgICAgICAgICAgICAgICAvrChk4R2Z1lKPDRCUV9ufIuZqLbFxrepmox9b2BSQzU7SVhmdYOSoK69y7+xopSFd2haSz0zQVBebXuKmKe1xMe4qpuNfnBhU0Q2OkhXZXSCkZ+tvMrAsqOVhnhpW0w+MkBPXWx6iZemtMPIuaucjn9xYlRFNzlHVmRzgZCerbvJwbKklYd4alxNPzE/TlxreYiWpbPCybqsnY+AcmNVRjg4RlVjcoCPnay6yMKzpZaIeWtdTkAxPk1baniHlaSywcq7rZ6QgXNkVkc5N0VUYnF/jpyrucjDtKaXiXpsXU9BMj5MWml3hpSjscDLvK6fkYJ0ZVdIOjZEU2Fwfo2bqrjHxLWnmIp7bV5QQjM9S1lod4WTorC/zL2voJKDdWZYSTs1Q1Jgb32Mmqm3xsW2qJmLfG5fUUI0PEpZZ3aEk6Gvvsy+sKGThHZnWUo8NEJRX258i5motsXGt6majH1vYFJDNTtJWGZ1g5Kgrr3Lv7GilIV3aFpLPTNBUF5te4qYp7XEx7iqm41+cGFTRDY6SFdldIKRn668ysCxo5WGd2lbTD4yQE9dbHqJl6a0w8i5q5yOf3FiVEU3OUdWZHOBkJ6tu8nBsqSVh3hqXE0/MT9OXGt5iJals8LJuqydj4ByY1VGODhGVWNygI+drLrJwrOlloh5a1xOQDE/TVtqeIeVpLLByrutnpCBc2RWRzk3RVRicX+OnKu5yMO0ppeJemxdT0EyPkxaaXeGlKOxwMu8rp+RgnRlV0g6NkRTYXB+jZuquMfEtaeYinttXlBBMz1LWmh3hZSisL/Lva+gkoN1ZlhJOzVDUmBvfYyaqbfGxbaomYt8bl9RQjQ8SllndoSToa++zL6woZOEdmdZSjw0QlFfboCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgAA=";
let flashBuffer = null;
function loadFlashSound(){
  try{
    if(flashBuffer) return;
    const ctx = audio();
    const bin = atob(FLASH_WAV_B64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer.slice(0), b => { flashBuffer = b; }, () => {});
  }catch(e){}
}
function beepFlash(){
  try{
    if(flashBuffer){
      const ctx = audio();
      const play = () => { const s = ctx.createBufferSource(); s.buffer = flashBuffer; s.connect(ctx.destination); s.start(); };
      if(ctx.state === "running") play(); else ctx.resume().then(play).catch(play);
      return;
    }
    loadFlashSound();
  }catch(e){}
  tone(880, 0.1, {vol:0.55});   // フォールバック: 低め・ピッ
}
const beepCorrect   = () => { tone(1568, 0.14); tone(1175, 0.34, {delay:0.15}); };  // ピンポーン
const beepIncorrect = () => { tone(170, 0.16, {type:"square", vol:0.3}); tone(170, 0.4, {type:"square", vol:0.3, delay:0.24}); }; // ブッブー

/* ---------- 問題生成 ---------- */
const rand = (a,b) => Math.floor(Math.random() * (b - a + 1)) + a;
function makeNumber(minD, maxD, vary){
  const d = vary ? rand(minD, maxD) : maxD;
  if(d <= 1) return rand(1, 9);
  return rand(Math.pow(10, d - 1), Math.pow(10, d) - 1);
}
function makeProblem(minD, maxD, mouth, vary, sub, answerNegative){
  if(sub && mouth >= 2){
    // 2つ目以降の一部をマイナスにする（例: 500, -1,234, 300）。1つ目は必ずプラスで、
    // マイナスは最低1つ入る。数字も符号も引き直しながら条件に合う問題を探す。
    // answerNegative=false: 答えはプラス / true: 答えはマイナス
    let best = null;
    for(let attempt = 0; attempt < 1000; attempt++){
      const cand = Array.from({length: mouth}, () => makeNumber(minD, maxD, vary));
      for(let i = 1; i < cand.length; i++) if(Math.random() < 0.5) cand[i] = -cand[i];
      if(cand.every(n => n > 0)){ const idx = rand(1, cand.length - 1); cand[idx] = -cand[idx]; }
      const total = cand.reduce((a, b) => a + b, 0);
      if(answerNegative){
        if(total < 0) return cand;
        if(!best || total < best.reduce((a, b) => a + b, 0)) best = cand;
      } else if(total > 0) return cand;
    }
    if(answerNegative && best) return best;
    // 答えプラスの指定で万一見つからなければ全てプラスの問題にする
  }
  return Array.from({length: mouth}, () => makeNumber(minD, maxD, vary));
}
const fmt = n => (n === null || n === undefined || n === "") ? "" : Number(n).toLocaleString("ja-JP");

/* ---------- 状態 ---------- */
let cfg = null, problemIndex = 0, currentNumbers = [], currentSeries = [], records = {}, sessionStart = null, queuedSeries = null;

/* 並列計算の各組の表示位置 [(中心x比, 中心y比, セル幅比, セル高さ比, 位置ラベル), ...]
   layout: single / row（横並び）/ col（縦並び）/ tri（三角）/ square（四角）/ poly（多角形） */
function layoutPositions(count, layout, w, h){
  if(count <= 1) return [[0.5, 0.5, 1, 1, ""]];
  if(layout === "col"){
    const labels = count === 2 ? ["上", "下"] : count === 3 ? ["上", "真ん中", "下"]
      : Array.from({ length: count }, (_, i) => `${i + 1}番`);
    return labels.map((lb, i) => [0.5, (i + 0.5) / count, 1, 1 / count, lb]);
  }
  if(layout === "tri" && count === 3)
    return [[0.5, 0.27, 0.62, 0.46, "上"], [0.26, 0.74, 0.48, 0.46, "左下"], [0.74, 0.74, 0.48, 0.46, "右下"]];
  if(layout === "square" && count === 4)
    return [[0.25, 0.26, 0.5, 0.48, "左上"], [0.75, 0.26, 0.5, 0.48, "右上"], [0.25, 0.74, 0.5, 0.48, "左下"], [0.75, 0.74, 0.5, 0.48, "右下"]];
  if(layout === "poly" && count >= 5){
    /* 多角形: 正n角形の頂点を土台に、てっぺんから時計回りに配置する。
       半径はピクセル単位で縦横そろえる（画面の比率で引き伸ばさない） */
    const W = w || window.innerWidth || 1, H = h || window.innerHeight || 1;
    const R = 0.33 * Math.min(W, H);
    const rx = R / W, ry = R / H;
    const cw = Math.min(0.9, 2 * rx * Math.sin(Math.PI / count) * 0.95);
    const ch = Math.min(0.9, 2 * ry * Math.sin(Math.PI / count) * 0.95);
    const units = [];
    for(let i = 0; i < count; i++){
      const ang = -Math.PI / 2 + i * 2 * Math.PI / count;
      units.push([Math.cos(ang), Math.sin(ang)]);
    }
    /* 段（同じ高さの並び）の間隔を均等にする。横位置は正多角形のまま、
       縦位置だけを段ごとに等間隔へ並べ替える（そのため正多角形ではなくなる） */
    const levels = [...new Set(units.map(u => Math.round(u[1] * 1e9) / 1e9))].sort((a, b) => a - b);
    const yMin = levels[0], yMax = levels[levels.length - 1];
    const evenY = v => {
      const idx = levels.indexOf(Math.round(v * 1e9) / 1e9);
      return levels.length < 2 ? v : yMin + (yMax - yMin) * idx / (levels.length - 1);
    };
    return units.map((u, i) => [0.5 + rx * u[0], 0.5 + ry * evenY(u[1]), cw, ch, `${i + 1}番`]);
  }
  const labels = count === 2 ? ["左", "右"] : count === 3 ? ["左", "真ん中", "右"]
    : Array.from({ length: count }, (_, i) => `${i + 1}番`);
  return labels.map((lb, i) => [(i + 0.5) / count, 0.5, 1 / count, 1, lb]);
}
/* 並列計算数に応じて「出し方」「配置」の有効/無効と文言を切り替える。
   横並び・縦並びは2組以上なら常に選べる。「形」は3組=三角、4組=四角、5組以上=多角形。
   組数を変えたら配置は横並び（既定）に戻す */
let lastSeries = 1;
let layoutPref = "row";   // 選んだ配置は組数が変わっても記憶する
function refreshSeriesState(){
  let n = parseInt(zenNum($("seriesCount").value), 10);
  if(isNaN(n)) n = 1;
  const rowR = document.querySelector('input[name="layoutMode"][value="row"]');
  const colR = document.querySelector('input[name="layoutMode"][value="col"]');
  const shapeR = document.querySelector('input[name="layoutMode"][value="shape"]');
  lastSeries = n;
  /* 選んだ配置は記憶し、組数が変わっても使える間は維持する。
     「形」は3組未満では使えないので、その間だけ横並びで代用し、3組以上に戻れば復活する */
  const effLayout = (layoutPref === "shape" && n < 3) ? "row" : layoutPref;
  (effLayout === "col" ? colR : effLayout === "shape" ? shapeR : rowR).checked = true;
  document.querySelectorAll('input[name="presentMode"]').forEach(r => { r.disabled = n < 2; });
  $("presentRow").style.opacity = n < 2 ? "0.4" : "1";
  rowR.disabled = n < 2;
  colR.disabled = n < 2;
  shapeR.disabled = n < 3;
  $("layoutRow").style.opacity = n < 2 ? "0.4" : "1";
  $("layoutShapeLabel").textContent = n === 4 ? "四角" : (n >= 5 ? "多角形" : "三角");
}

/* 1つの数字の表示秒数と、消えてから次までの間隔（秒）を返す。
   total の場合は全体が totalSeconds になるよう口数で等分する */
function computeTiming(count){
  if(cfg.timingMode === "total"){
    const cycle = cfg.totalSeconds / Math.max(1, count);
    const blank = Math.min(0.3, cycle * 0.25);
    return { show: cycle - blank, blank };
  }
  return { show: cfg.seconds, blank: 0.3 };
}

function readConfig(){
  const c = {
    minD: intOf("minDigits"), maxD: intOf("maxDigits"),
    mouth: intOf("mouth"), seconds: floatOf("seconds"),
    totalSeconds: floatOf("totalSeconds"),
    timingMode: checkedVal("timingMode", "total"),
    vary: checkedVal("digitMode", "maxonly") === "random",
    sub: checkedVal("subMode", "off") === "on",
    answerNegative: checkedVal("answerSignMode", "positive") === "negative",
    questions: parseInt(qSel.value, 10),
    series: intOf("seriesCount"),
    present: checkedVal("presentMode", "simul"),
    layout: "single"
  };
  if(isNaN(c.series)) return startError("並列計算数には数値を入力してください。");
  if(c.series < 1 || c.series > 12) return startError("並列計算数は1〜12にしてください。");
  // 配置は組数と選択から確定させる（「形」は3組=三角、4組=四角、5組以上=多角形）
  if(c.series >= 2){
    const choice = checkedVal("layoutMode", "row");
    c.layout = choice === "shape"
      ? (c.series === 3 ? "tri" : c.series === 4 ? "square" : "poly")
      : choice;
  }
  if(isNaN(c.maxD) || isNaN(c.mouth) || (c.vary && isNaN(c.minD))) return startError("数字の欄には数値を入力してください。");
  if(c.maxD < 1) return startError("桁数の設定を確認してください（1以上）。");
  if(c.vary && (c.minD < 1 || c.minD > c.maxD)) return startError(`桁数の設定を確認してください。最小桁数は最大桁数以下にしてください（今は最小${c.minD}・最大${c.maxD}です）。`);
  if(!c.vary) c.minD = c.maxD;   // 最大桁数のみ: 最小桁数は使わない
  if(c.mouth < 1) return startError("口数は1以上にしてください。");
  // 時間設定は選んだ決め方の方だけを検証する
  if(c.timingMode === "per" && !(c.seconds > 0)) return startError("数字表示秒数には0より大きい数値を入力してください。");
  if(c.timingMode === "total" && !(c.totalSeconds > 0)) return startError("全体の秒数には0より大きい数値を入力してください。");
  return c;
}

$("startBtn").addEventListener("pointerdown", unlockAudio);  // 触れた瞬間に音を解放
$("startBtn").addEventListener("click", () => {
  /* 万一どこかで例外が出ても「無反応」で終わらせず、理由を表示する */
  try{
    clearStartError();
    const c = readConfig(); if(!c) return;
    unlockAudio(); // ユーザー操作の中でAudioContextを解放（iPhone対策）
    cfg = c; problemIndex = 0; records = {}; queuedSeries = null;
    makeSeries();
    sessionStart = Date.now();
    countdownThenFlash();
  }catch(e){
    const msg = "スタートできませんでした。" + (e && e.message ? e.message : e);
    startError(msg);          // 画面内にも出す（alertが出ない環境でも見えるように）
    alert(msg);
  }
});
/* 全画面ボタン: ブラウザのバー等を隠して画面いっぱいに表示するためのもの。
   ただしiPhoneのSafariはWebページの全画面表示に未対応のため、その場合は
   無反応にせず「ホーム画面に追加」の案内を出す（追加後は全画面で起動できる） */
function showFsHelp(){
  const msg = "iPhoneのSafariでは、ボタンから全画面にできません。\n\n共有ボタン（四角に↑のマーク）→「ホーム画面に追加」をすると、ホーム画面のアイコンから全画面（アドレスバー無し）で起動できます。";
  startError(msg);          // 画面内にも出す（alertが出ない環境でも見えるように）
  alert(msg);
}
const fsSupported = !!(document.documentElement.requestFullscreen
                      || document.documentElement.webkitRequestFullscreen);
$("fsBtn").addEventListener("click", () => {
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    if(!fsSupported){ showFsHelp(); return; }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    const r = req.call(el);
    if(r && r.catch) r.catch(() => showFsHelp());   // 拒否された場合も無反応にしない
  }catch(e){ showFsHelp(); }
});

/* ---------- カウントダウン → 出題 ---------- */
function countdownThenFlash(){
  clearTimers(); show("countScreen");
  const steps = [3, 2, 1];
  steps.forEach((n, i) => later(() => { $("countNum").textContent = n; beepCountdown(); }, i * 1000));
  later(flashNumbers, steps.length * 1000);
}
/* 文字の実際の幅を測って、画面に収まるフォントサイズを返す。
   abacus2 は数字1文字が約0.88em幅と広いため、文字数×0.62em のような
   概算でははみ出す。canvas で実測し、読込前の概算上限でも保険をかける。 */
const _measureCtx = (() => { try { return document.createElement("canvas").getContext("2d"); } catch(e){ return null; } })();
function fitSizePx(el, text, basePx, maxW){
  if(!text) return basePx;
  let size = basePx;
  if(_measureCtx){
    const cs = getComputedStyle(el);
    _measureCtx.font = cs.fontWeight + " " + basePx + "px " + cs.fontFamily;
    const w = _measureCtx.measureText(text).width || 1;
    if(w > maxW) size = basePx * maxW / w;
  }
  let estEm = 0;
  for(const ch of text) estEm += (ch === "," || ch === ".") ? 0.3 : 1.0;
  size = Math.min(size, maxW / Math.max(estEm, 0.3));
  return Math.max(20, Math.floor(size));
}
if(document.fonts && document.fonts.load){
  document.fonts.load('bold 40px abacus2', "0123456789,-");
  document.fonts.load('40px abacus2', "0123456789,-");
}
/* 数字の大きさは問題ごとに固定する。一番幅が広い数字（最大桁数、
   引き算のときはマイナス付き）に合わせて決めるので、出題中に大きさが変わらない */
function referenceText(){
  const d = Math.max(1, cfg ? cfg.maxD : 3);
  let s = "8".repeat(d).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  if(cfg && cfg.sub) s = "-" + s;
  return s;
}
let flashFontSize = null;
let flashCells = [];
function buildFlashCells(){
  const stage = $("flashStage");
  stage.innerHTML = "";
  /* 配置の比率は、実際に表示するステージの実寸から計算する
     （ウィンドウ寸法とステージ寸法がずれる環境でも正多角形を保つため） */
  const sw = stage.clientWidth || window.innerWidth, sh = stage.clientHeight || window.innerHeight;
  flashCells = layoutPositions(cfg.series, cfg.layout, sw, sh).map(p => {
    const d = document.createElement("div");
    d.className = "flash-cell numfont";
    d.style.left = (p[0] * 100) + "%";
    d.style.top = (p[1] * 100) + "%";
    stage.appendChild(d);
    return d;
  });
}
function fitFlashFont(){
  /* 数字の大きさは問題ごとに固定する。並列表示では一番小さいセルに
     収まる大きさに統一する（1組のときは従来どおり画面全体で決める） */
  if(!flashCells.length) return;
  const stage = $("flashStage");
  const sw = (stage && stage.clientWidth) || window.innerWidth, sh = (stage && stage.clientHeight) || window.innerHeight;
  const positions = layoutPositions(cfg.series, cfg.layout, sw, sh);
  const cellW = Math.min(...positions.map(p => p[2])) * sw;
  const cellH = Math.min(...positions.map(p => p[3])) * sh;
  const base = cfg.series <= 1
    ? Math.min(window.innerWidth * 0.36, window.innerHeight * 0.46, 340)
    : Math.min(cellW * 0.36, cellH * 0.46, 340);
  const maxW = cfg.series <= 1 ? window.innerWidth * 0.92 : cellW * 0.92;
  flashFontSize = fitSizePx(flashCells[0], referenceText(), base, maxW);
  flashCells.forEach(d => { d.style.fontSize = flashFontSize + "px"; });
}
function flashNumbers(){
  clearTimers(); show("flashScreen");
  buildFlashCells();
  fitFlashFont();   // この問題の数字の大きさを最大桁数に合わせて固定
  const mouth = currentSeries[0] ? currentSeries[0].length : 0;
  /* 出し方: 同時=各ステップで全組の同じ順番の数字を一緒に出す /
             順番=1組ずつ最後まで出してから次の組へ */
  let events, totalNumbers;
  if(cfg.present === "seq"){
    events = [];
    currentSeries.forEach((nums, s) => nums.forEach(n => events.push([[s, n]])));
    totalNumbers = events.length;
  } else {
    events = [];
    for(let k = 0; k < mouth; k++) events.push(currentSeries.map((nums, s) => [s, nums[k]]));
    totalNumbers = mouth;
  }
  const t = computeTiming(totalNumbers);
  const showMs = t.show * 1000, blankMs = t.blank * 1000;
  events.forEach((items, i) => {
    later(() => {
      flashCells.forEach(d => { d.style.visibility = "hidden"; });
      items.forEach(([s, n]) => { flashCells[s].textContent = fmt(n); flashCells[s].style.visibility = "visible"; });
      beepFlash();
    }, i * (showMs + blankMs));
    later(() => { flashCells.forEach(d => { d.style.visibility = "hidden"; }); }, i * (showMs + blankMs) + showMs);
  });
  later(showAnswer, events.length * (showMs + blankMs));
}

/* ---------- 解答入力 ---------- */
let answerBlocks = [];   // [{block, input, minus}, ...] 組の順番どおり
function buildAnswerBlocks(){
  const grid = $("answerGrid");
  grid.innerHTML = "";
  grid.style.cssText = "";
  const positions = layoutPositions(cfg.series, cfg.layout);
  answerBlocks = positions.map(p => {
    const block = document.createElement("div");
    block.className = "ans-block";
    if(p[4]){
      const lab = document.createElement("div");
      lab.className = "ans-label"; lab.textContent = p[4];
      block.appendChild(lab);
    }
    const rowEl = document.createElement("div");
    rowEl.style.cssText = "display:flex;gap:8px;align-items:stretch;width:100%";
    const inp = document.createElement("input");
    inp.className = "numfont ans-input"; inp.type = "text";
    inp.setAttribute("inputmode", "numeric"); inp.autocomplete = "off";
    inp.style.cssText = "flex:1 1 0;min-width:0;width:0;margin:0;text-align:center";
    const mb = document.createElement("button");
    mb.type = "button"; mb.className = "ans-minus"; mb.textContent = "−";
    mb.title = "マイナスを付ける／外す";
    rowEl.appendChild(inp); rowEl.appendChild(mb);
    block.appendChild(rowEl);
    return { block, input: inp, minus: mb };
  });
  /* 入力欄の並びは数字の配置に合わせる（どの答えがどの組か迷わないように） */
  if(cfg.series <= 1){
    grid.style.cssText = "display:flex;justify-content:center;width:min(92vw,520px);max-width:92vw";
    answerBlocks[0].block.style.width = "100%";
    grid.appendChild(answerBlocks[0].block);
  } else if(cfg.layout === "row"){
    grid.style.cssText = "display:flex;gap:12px;width:min(96vw,900px)";
    answerBlocks.forEach(b => { b.block.style.flex = "1 1 0"; b.block.style.minWidth = "0"; grid.appendChild(b.block); });
  } else if(cfg.layout === "col"){
    grid.style.cssText = "display:flex;flex-direction:column;gap:14px;width:min(92vw,520px)";
    answerBlocks.forEach(b => grid.appendChild(b.block));
  } else if(cfg.layout === "tri"){
    grid.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(96vw,760px)";
    answerBlocks[0].block.style.gridColumn = "1 / 3";
    answerBlocks[0].block.style.width = "50%";
    answerBlocks[0].block.style.justifySelf = "center";
    answerBlocks.forEach(b => grid.appendChild(b.block));
  } else { /* square / poly: ます目状に並べる */
    const cols = cfg.layout === "square" ? 2 : Math.ceil(Math.sqrt(cfg.series));
    grid.style.cssText = `display:grid;grid-template-columns:repeat(${cols},1fr);gap:14px;width:min(96vw,860px)`;
    answerBlocks.forEach(b => grid.appendChild(b.block));
  }
  answerBlocks.forEach((b, i) => {
    b.input.addEventListener("keydown", e => { if(/^[0-9]$/.test(e.key)) beepFlash(); });  // 数字入力のたびに音
    b.input.addEventListener("input", () => {
      const neg = b.input.value.includes("-");   // どの位置で打っても先頭のマイナスとして扱う
      const raw = b.input.value.replace(/[^0-9]/g, "");
      b.input.value = raw ? (neg ? "-" : "") + fmt(raw) : (neg ? "-" : "");
    });
    b.input.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      e.stopPropagation();   // document側のEnter判定に伝播させない（二重発火防止）
      if(i + 1 < answerBlocks.length) answerBlocks[i + 1].input.focus();   // Enterで次の欄へ
      else submitAnswer();
    });
    /* iPhoneの数字キーパッドには「−」キーが無いので、ボタンでも付け外しできるようにする */
    b.minus.addEventListener("click", () => {
      const v = b.input.value;
      b.input.value = v.includes("-") ? v.replace(/-/g, "") : "-" + v;
      beepFlash();
      b.input.focus();
    });
  });
}
/* 答えは最大で「最大桁数+1桁（繰り上がり）」+マイナス+コンマ まで。
   その最長の答えに合わせて大きさを固定するので、入力中に大きさが変わらない */
function fitAnswerFont(){
  const d = Math.max(1, (cfg ? cfg.maxD : 3) + 1);
  let ref = "8".repeat(d).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  if(cfg && cfg.sub) ref = "-" + ref;
  answerBlocks.forEach(b => {
    const avail = Math.max(60, b.input.clientWidth - 34);
    if(avail > 60) b.input.style.fontSize = fitSizePx(b.input, ref, 40, avail) + "px";
  });
}
function showAnswer(){
  clearTimers(); show("answerScreen");
  $("answerTitle").textContent = `第${problemIndex + 1}問　答えを入力してください`;
  buildAnswerBlocks();
  fitAnswerFont();
  setTimeout(() => { fitAnswerFont(); if(answerBlocks[0]) answerBlocks[0].input.focus(); }, 60);   // カーソルは予め最初の解答欄へ
}
window.addEventListener("resize", () => {
  if(cfg) fitFlashFont();
  fitAnswerFont();
});
$("answerBtn").addEventListener("click", submitAnswer);

function parseAnswer(v){
  const neg = v.includes("-");
  const raw = v.replace(/[^0-9]/g, "");
  return raw === "" ? null : (neg ? -parseInt(raw, 10) : parseInt(raw, 10));   // 空白も入力として不正解扱い
}
function submitAnswer(){
  /* 組ごとに採点する */
  const results = currentSeries.map((nums, s) => {
    const user = parseAnswer(answerBlocks[s] ? answerBlocks[s].input.value : "");
    const answer = nums.reduce((a, b) => a + b, 0);
    return { numbers: [...nums], answer, user, correct: user !== null && user === answer };
  });
  records[problemIndex] = { series: results, correct: results.every(r => r.correct) };
  showJudge(results);
}

/* ---------- 正誤判定 ---------- */
function showJudge(results){
  clearTimers(); show("judgeScreen");
  const allCorrect = results.every(r => r.correct);
  if(allCorrect){ beepCorrect(); $("judgeMark").textContent = "〇"; $("judgeMark").className = "mark ok"; $("judgeText").textContent = "正解！"; $("judgeDetail").innerHTML = ""; }
  else {
    beepIncorrect(); $("judgeMark").textContent = "×"; $("judgeMark").className = "mark ng"; $("judgeText").textContent = "不正解";
    if(results.length === 1){
      const r = results[0];
      $("judgeDetail").innerHTML =
        `あなたの答え： <span class="val numfont">${r.user === null ? "（未入力）" : fmt(r.user)}</span><br>` +
        `正解： <span class="val numfont" style="color:#00b84f">${fmt(r.answer)}</span>`;
    } else {
      /* 並列計算: 組ごとに〇×を表示し、間違えた組は答えも出す */
      const positions = layoutPositions(cfg.series, cfg.layout);
      $("judgeDetail").innerHTML = results.map((r, s) =>
        `<div>${positions[s][4]}： <span style="color:${r.correct ? "#00b84f" : "#ff5252"};font-weight:bold">${r.correct ? "〇" : "×"}</span>` +
        (r.correct ? "" : `　あなたの答え <span class="val numfont">${r.user === null ? "（未入力）" : fmt(r.user)}</span>　正解 <span class="val numfont" style="color:#00b84f">${fmt(r.answer)}</span>`) + `</div>`
      ).join("");
    }
  }
  document.querySelectorAll("#judgeDetail .val").forEach(el => {
    el.style.fontSize = fitSizePx(el, el.textContent, 30, window.innerWidth * 0.58) + "px";
  });
  const isLast = problemIndex >= cfg.questions - 1;
  $("nextBtn").style.display = isLast ? "none" : "";        // 次の問題へは最終問題以外
  $("resultRow").style.display = isLast ? "flex" : "none";  // 全問題終了時は右下の次へ→リザルト（4ボタン行の上の段に表示）
}
$("sameBtn").addEventListener("click", () => countdownThenFlash());
/* 元の数字の集合を一切変えず（新しい数字は作らず）、並びだけを変える。
   今までと同じ並びにはせず、できれば全ての位置が違う並びにする */
function shuffleDifferent(source, avoidOrder){
  const src = [...source], avoid = avoidOrder ? [...avoidOrder] : [...source];
  if(src.length < 2 || new Set(src).size < 2) return src;
  let best = null;
  for(let k = 0; k < 100; k++){
    const a = [...src];
    for(let i = a.length - 1; i > 0; i--){ const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; }
    if(a.join(",") === avoid.join(",")) continue;
    if(a.every((v, i) => v !== avoid[i])) return a;
    if(!best) best = a;
  }
  return best || src.slice(1).concat(src[0]);
}
$("shuffleBtn").addEventListener("click", () => {
  // 元の問題の数字（記録済みのもの）が土台なので、新しい数字は絶対に出ない。
  // 並列計算では組ごとに並べ替える
  const rec = records[problemIndex];
  if(rec && rec.series){
    currentSeries = rec.series.map((r, s) => shuffleDifferent(r.numbers, currentSeries[s]));
    currentNumbers = currentSeries[0] || [];
  }
  countdownThenFlash();
});
$("nextBtn").addEventListener("click", nextProblem);
$("toResultBtn").addEventListener("click", showResult);
$("homeBtn1").addEventListener("click", goHome);
$("homeBtn2").addEventListener("click", goHome);
$("resultSameBtn").addEventListener("click", () => restartAll(false));
$("resultShuffleBtn").addEventListener("click", () => restartAll(true));
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target && e.target.closest && e.target.closest("input, button, select, textarea")) return;  // 入力欄・ボタン上のEnterは要素本来の動作に任せる
  if(!$("judgeScreen").classList.contains("active")) return;
  if(problemIndex >= cfg.questions - 1) showResult(); else nextProblem();  // Enter = 次の問題へ
});
/* 現在の設定で、組数ぶんの問題を生成する */
function makeSeries(){
  currentSeries = [];
  for(let s = 0; s < cfg.series; s++)
    currentSeries.push(makeProblem(cfg.minD, cfg.maxD, cfg.mouth, cfg.vary, cfg.sub, cfg.answerNegative));
  currentNumbers = currentSeries[0] || [];
}
function nextProblem(){
  problemIndex++;
  if(queuedSeries && queuedSeries[problemIndex]){
    currentSeries = queuedSeries[problemIndex].map(a => [...a]);
    currentNumbers = currentSeries[0] || [];
  } else makeSeries();
  countdownThenFlash();
}
/* リザルトから全問やり直す: 同じ問題（記録どおり）／順番を変える（記録の数字を並べ替え）。
   どちらも新しい数字は作らない */
function restartAll(shuffle){
  const total = cfg ? cfg.questions : 0;
  const queue = [];
  for(let i = 0; i < total; i++){
    const rec = records[i];
    if(!rec || !rec.series) return;   // 記録がそろっていない場合は何もしない
    queue.push(rec.series.map(r => shuffle ? shuffleDifferent(r.numbers, r.numbers) : [...r.numbers]));
  }
  if(!queue.length) return;
  queuedSeries = queue;
  problemIndex = 0;
  records = {};
  sessionStart = Date.now();
  currentSeries = queue[0].map(a => [...a]);
  currentNumbers = currentSeries[0] || [];
  countdownThenFlash();
}
function goHome(){ clearTimers(); show("settingsScreen"); }

/* ---------- リザルト ---------- */
function showResult(){
  clearTimers(); show("resultScreen");
  const total = cfg.questions, count = cfg.series;
  const positions = layoutPositions(count, cfg.layout);
  const elapsed = sessionStart ? (Date.now() - sessionStart) / 1000 : 0;
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  const elapsedText = m ? `${m}分${s.toFixed(1)}秒` : `${s.toFixed(1)}秒`;
  const totalAnswers = total * count;
  let correctCount = 0, rows = "";
  for(let i = 0; i < total; i++){
    const rec = records[i];
    for(let s2 = 0; s2 < count; s2++){
      const r = rec && rec.series ? rec.series[s2] : null;
      if(r && r.correct) correctCount++;
      const label = count === 1 ? `第${i + 1}問` : `第${i + 1}問・${positions[s2][4]}`;
      rows += `<tr><td>${label}</td>` +
        (r ? `<td class="val numfont">${fmt(r.answer)}</td><td class="val numfont">${r.user === null ? "（未入力）" : fmt(r.user)}</td>` +
             `<td style="font-size:20px;color:${r.correct ? "#00b84f" : "#ff5252"}">${r.correct ? "〇" : "×"}</td>`
           : `<td>-</td><td>-</td><td>-</td>`) + `</tr>`;
    }
  }
  $("resultBody").innerHTML = rows;
  const totalText = count === 1 ? `${total}問` : `${totalAnswers}組`;
  $("resultSummary").innerHTML =
    `正答率： <b>${(correctCount / totalAnswers * 100).toFixed(1)}%</b>（${correctCount} / ${totalText}）<br>かかった時間： ${elapsedText}`;
}
/* 初期化が最後まで完了したら「プログラムが動いていない場合」の警告を消す。
   この行に到達できない環境（プレビュー表示など）では警告が残り続ける */
$("jsWarn").style.display = "none";
</script>
