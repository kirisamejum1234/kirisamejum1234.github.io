function renderCalc(){
  const view=viewItems();
  // タブ (通常は上部横並び、みとりざんは左端縦並び)
  const host=SS.subject==="mitori"?$("tabsCol"):$("tabs");
  // 再構築の判定は元の問題リスト (セッション中は不変) で行う。
  // viewItems() は通常モードでは毎回新しい配列を返すため、それと
  // 比較すると常時「変わった」ことになり、OK を押すたびにタブ帯を
  // innerHTML から作り直していた (実測: OK 1回で childList 変異11件)。
  // ver.20261118-12 で元リスト比較に修正
  const viewSrc=SS.mode==="naoshi"?SS.nItems:SS.items;
  if(SS.tabsFor!==viewSrc){
    SS.tabsFor=viewSrc;
    ["tabs","tabsCol"].forEach(id=>{$(id).innerHTML="";});
    view.forEach((it,i)=>{
      const b=mkEl("button","tab num",String(it.orig+1));
      b.addEventListener("click",()=>gotoQuestion(i));
      host.appendChild(b);
    });
  }
  for(let i=0;i<view.length;i++){
    const tb=host.children[i];if(!tb)break;
    let cls="tab num"+(i===SS.idx?" current":"");
    if(SS.mode==="naoshi"&&SS.nCleared.has(i))cls+=" cleared";
    if(tb.className!==cls)tb.className=cls;
  }
  const curTab=host.children[SS.idx];
  if(curTab&&curTab.scrollIntoView)curTab.scrollIntoView({block:"nearest",inline:"nearest"});
  $("naoshiTag").style.display=SS.mode==="naoshi"?"":"none";
  $("btnSurrender").style.display=SS.mode==="naoshi"?"":"none";
  // なおしの最中は正解を表示しない (ver.20261118-35、ユーザー指示:
  // 正解は結果画面でのみ、なおし完了後か降参後に出す)
  // 問題と答え欄: 1問の描画で例外が出ても、タブ・キーパッド・採点・
  // AC×5 が死なないよう、描画を切り離して例外時はプレーンテキストで出す
  // (法則クイズ10問目で無反応になる報告への防御。状態遷移は描画の前に
  // 済んでいるので、描画が失敗しても操作は続けられる)
  const p=curProb();
  try{renderProblemAndAnswer(p);}
  catch(e){
    try{
      const pa=$("probArea");pa.innerHTML="";
      const line=mkEl("div","problem");
      line.textContent=problemFallbackText(p);
      pa.appendChild(line);
      const aa=$("ansArea");aa.innerHTML="";
      if(SS.subject!=="mitori"){
        const box=mkEl("div","input-box num");box.id="ansBox0";
        fillAnsBox(box);aa.appendChild(box);
      }
    }catch(e2){}
  }
  $("btnTop")&&$("btnTop").classList.toggle("show",SS.topVisible);
  $("btnSaiten").classList.toggle("show",canGrade());
  fitProblem();
  if(SS.subject==="mitori"){fitMitori();fitMitoriTabs();}
}
function problemFallbackText(p){
  if(!p)return "";
  if(SS.subject==="quiz")return p.text||"";
  if(SS.subject==="kaihou")return "√"+(p.radicand_text||"")+" =";
  if(p.text)return p.text+" =";
  return "";
}
// みとりざん: そのセットで必要な最大幅 (符号込みの最大の数・答え) を
// 基準フォントサイズで実測し、枠幅を決める。従来は枠幅が表示列いっぱい
// 固定で、桁数が小さいセットでは枠内の左側の空白が過大だった
// (ユーザー指摘、ver.20261118-13 でセット最大幅方式に変更)。
// 枠の右端は従来位置のまま (1の位の位置合わせは維持)、入りきらない
// 場合は従来どおり fitMitori がフォントを縮める
let _mitoriCtx=null;
function mitoriSetWidth(fs){
  try{
    if(!_mitoriCtx)_mitoriCtx=document.createElement("canvas").getContext("2d");
    const sample=document.querySelector(".mitori-num");
    const fam=sample?getComputedStyle(sample).fontFamily:"sans-serif";
    _mitoriCtx.font=fs+"px "+fam;
    let mx=0;
    viewItems().forEach(it=>{
      const p=it.prob;
      (p.operands||[]).forEach(v=>{
        let t=fmtVC([v[0]<0n?-v[0]:v[0],v[1]]);
        if(v[0]<0n)t="−"+t;
        mx=Math.max(mx,_mitoriCtx.measureText(t).width);
      });
      if(p.answer){
        let at=fmtVC([p.answer[0]<0n?-p.answer[0]:p.answer[0],p.answer[1]]);
        if(p.answer[0]<0n)at="−"+at;
        mx=Math.max(mx,_mitoriCtx.measureText(at).width);
      }
    });
    if(!(mx>0))return 0;
    // 左右 padding 10×2 + 描画誤差の余裕 4 (枠線は付けない形に
    // なったため枠分は不要。ver.20261118-25)
    return Math.ceil(mx)+24;
  }catch(e){return 0;}
}
function renderProblemAndAnswer(p){
  const pa=$("probArea");pa.innerHTML="";
  if(SS.subject==="mul"){
    pa.appendChild(probLine([[fmtVC(p.a),"num"]," × ",[fmtVC(p.b),"num"]," ="]));
  }else if(SS.subject==="div"){
    pa.appendChild(probLine([[fmtVC(p.dividend),"num"]," ÷ ",[fmtVC(p.divisor),"num"]," ="]));
  }else if(SS.subject==="kaihou"){
    const line=mkEl("div","problem");
    line.appendChild(rootSVG(p.kind,fmtVC(p.radicand)));
    const eq=mkEl("span","sym"," =");line.appendChild(eq);
    pa.appendChild(line);
  }else if(SS.subject==="quiz"){
    const line=mkEl("div","problem");
    if(p.leadDots)line.appendChild(mkEl("span","sym","… "));
    p.seq.forEach((t,i)=>{
      if(i>0)line.appendChild(mkEl("span","sym","、"));
      if(i===p.blank)line.appendChild(mkEl("span","quiz-blank"));
      else line.appendChild(mkEl("span","num",fmtVC([BigInt(t),0])));
    });
    if(p.trailDots)line.appendChild(mkEl("span","sym"," …"));
    pa.appendChild(line);
  }else{
    // みとりざん: 数字の列 + 隙間と横線 + その下の答え記入欄
    // (枠は付けない。用紙の1列そのままの形。ver.20261118-25)
    const wrap=mkEl("div","mitori-wrap");
    const col=mkEl("div","mitori-col");
    const vh=document.documentElement.clientHeight||800;
    // 数字は収まる範囲で最大に (ver.20261118-14、ユーザーの手書き
    // 参考が基準): 目標は数字の高さが画面高の約1割、行ピッチは
    // 数字の高さの約2倍 (line-height:1.5)。口数が多くてブロック
    // (口数×ピッチ+回答枠) が収まらないときだけ小さくし、最終的
    // には fitMitori が幅・高さの両方で収まるよう調整する
    const kou=p.operands.length;
    const paH=pa.clientHeight||Math.round(vh*0.6);
    let fs=Math.min(Math.round(vh*0.11),Math.floor((paH-120)/(1.5*kou)));
    fs=Math.max(14,fs);
    p.operands.forEach(v=>{
      const d=mkEl("div","mitori-num num");
      let txt=fmtVC([v[0]<0n?-v[0]:v[0],v[1]]);
      if(v[0]<0n)txt="−"+txt;
      d.textContent=txt;d.style.fontSize=fs+"px";
      col.appendChild(d);
    });
    wrap.appendChild(col);
    const divider=mkEl("div","mitori-divider");
    // 最後の数字と横線の間の隙間: 行間 (1.5em) の約1/3 ≒ 0.5em
    divider.style.height=Math.max(10,Math.round(fs*0.5))+"px";
    wrap.appendChild(divider);
    const ans=mkEl("div","mitori-ans num");
    ans.id="ansBox0";
    ans.style.fontSize=fs+"px";
    fillAnsBox(ans);
    wrap.appendChild(ans);
    pa.appendChild(wrap);
    // 枠幅はセット最大幅に合わせ、ブロック全体を中央に置く
    // (ver.20261118-14)。列幅いっぱいになる場合は従来の固定幅のまま
    const setW=mitoriSetWidth(fs);
    if(setW>0&&pa.clientWidth&&setW<pa.clientWidth){
      wrap.style.width=setW+"px";
      wrap.style.alignSelf="center";
    }
  }
  // 答え欄 (あまり あり でも1つの欄: 「商...あまり」をあらかじめ表示。
  // みとりざんは列の下の回答記入欄が答え欄なので、ここには作らない)
  const aa=$("ansArea");aa.innerHTML="";
  if(SS.subject!=="mitori"){
    const box=mkEl("div","input-box num");
    box.id="ansBox0";
    fillAnsBox(box);
    aa.appendChild(box);
  }
}
// みとりざん: 列レイアウトを「スロット方式」で確定させる
// (ver.20261118-26、PC版と同じ方式)。旧方式は列の高さを flex の
// 自動計算に任せ、あふれ判定も flex で縮んだ後の箱の実測高さで
// 見ていたため、箱だけ縮んで数字が列からはみ出し、最後の数字が
// 横線に重なることがあった (実Chromiumの実測で確認: 条件により
// 最後の数字の下端が横線を最大で約50pxも越えていた)。
// 新方式は、記入欄と横線の高さを先に差し引いた残りを口数で
// 均等に割り (スロット)、各行の高さと行送りをスロット px で
// 明示する。ピッチは割り算だけで決まるのでフォント実測に
// 依存しない。フォントサイズは行ボックス (1.5em) がスロットに
// 収まる範囲で決め (基準サイズから拡大はしない)、幅があふれる
// 場合だけ従来どおり縮小する
function fitMitori(){
  const wrap=document.querySelector(".mitori-wrap");if(!wrap)return;
  const col=wrap.querySelector(".mitori-col");if(!col)return;
  const nums=[...col.querySelectorAll(".mitori-num")];if(!nums.length)return;
  const ans=wrap.querySelector(".mitori-ans");
  const divider=wrap.querySelector(".mitori-divider");
  const pa=$("probArea");
  const kou=nums.length;
  let fs=parseFloat(nums[0].style.fontSize)||30;
  let slot=0;
  for(let i=0;i<20;i++){
    const paH=(pa&&pa.clientHeight)||wrap.clientHeight||0;
    const ansH=ans?ans.getBoundingClientRect().height:0;
    const divH=Math.max(10,Math.round(fs*0.5));
    // 列に使える高さ = 全体 - 記入欄 - 横線まわり - 列の上下 padding (12)
    slot=Math.max(1,Math.floor((paH-ansH-divH-12)/kou));
    const overH=1.5*fs>slot;
    const overW=nums.some(d=>d.getBoundingClientRect().width>col.clientWidth-20);
    if(!overH&&!overW)break;
    // 高さ側は割り算で直接決める (行ボックス 1.5em がスロットに
    // 収まる最大のフォント)。幅あふれは従来どおり比率で縮める
    let nfs=fs;
    if(overH)nfs=Math.min(nfs,Math.floor(slot/1.5));
    if(overW)nfs=Math.min(nfs,Math.floor(fs*0.9));
    nfs=Math.max(12,nfs);
    if(nfs===fs)break;
    fs=nfs;
    nums.forEach(d=>d.style.fontSize=fs+"px");
    if(ans)ans.style.fontSize=fs+"px";
  }
  // スロットを各行に明示する: 行の高さ = 行送り = スロット px。
  // 列の高さもスロット×口数 + padding で固定する
  nums.forEach(d=>{d.style.height=slot+"px";d.style.lineHeight=slot+"px";});
  col.style.height=(slot*kou+12)+"px";
  // 隙間もフォントに比例させる (renderProblemAndAnswer と同じ式)
  if(divider)divider.style.height=Math.max(10,Math.round(fs*0.5))+"px";
}
// みとりざん: 左のタブ列を下へ伸ばし、最後のタブの下端が回答記入欄の
// 下端とちょうど同じ高さで終わるよう、各タブの高さを均等に調整する
// (タブ「1」の位置は変えない)。問題数 10/15/20・なおしでも同じ
function fitMitoriTabs(){
  if(SS.subject!=="mitori")return;
  const host=$("tabsCol");
  if(!host||!host.children.length)return;
  const ans=document.querySelector(".mitori-ans");
  if(!ans)return;
  const tabs=[...host.children];
  const n=tabs.length;
  const gap=4; // .tabs-col の gap
  const top=tabs[0].getBoundingClientRect().top;
  const bottom=ans.getBoundingClientRect().bottom;
  let h=(bottom-top-gap*(n-1))/n;
  if(!(h>4))return;
  tabs.forEach(t=>{t.style.flex="none";t.style.minHeight="0";t.style.height=h+"px";});
  // 丸め誤差を実測で吸収する
  const d=bottom-tabs[n-1].getBoundingClientRect().bottom;
  if(Math.abs(d)>0.6){
    h+=d/n;
    tabs.forEach(t=>{t.style.height=h+"px";});
  }
}
function probLine(parts){
  const d=mkEl("div","problem");
  parts.forEach(pt=>{
    if(Array.isArray(pt)){const s=mkEl("span",pt[1],pt[0]);d.appendChild(s);}
    else{const s=mkEl("span","sym",pt);d.appendChild(s);}
  });
  return d;
}
// 答え欄に表示すべき入力文字列。終了済み (finished) のとき編集
// バッファ cur は空に戻されているが、答え自体は answers に保存
// されている。その状態で cur を描くと、入力済みなのに □ が空に
// 見え、「入っていない」と思って打ち直すと二重入力になる
// (実機報告)。採点するまでの間、入力した数字は常に □ に見える
// よう、終了済みでは保存済みの答えを表示する。なおしは mode が
// 違うので従来どおり cur (下書き) を出す。PC版 _disp_cur と同じ
function dispCur(){
  if(SS.mode==="normal"&&SS.finished)
    return SS.answers[SS.idx]==null?"":SS.answers[SS.idx];
  return SS.cur;
}
function fillAnsBox(box){
  box.innerHTML="";
  if(isRem()){
    const [q,r]=remParts(dispCur());
    const locks=curLocks();
    const qs=mkEl("span","part num"+(locks.q?" locked":""),commaStr(q));
    const sep=mkEl("span","sep","...");
    const rs=mkEl("span","part num"+(locks.r?" locked":""),commaStr(r));
    box.appendChild(qs);box.appendChild(sep);box.appendChild(rs);
  }else{
    box.textContent=commaStr(dispCur());
  }
}
function paintInput(){
  const b0=$("ansBox0");if(b0)fillAnsBox(b0);
}
function saveCur(){
  if(SS.mode==="naoshi")SS.nDrafts[SS.idx]=SS.cur;
  else SS.answers[SS.idx]=SS.cur;
}
function loadCur(){
  const src=SS.mode==="naoshi"?SS.nDrafts[SS.idx]:SS.answers[SS.idx];
  SS.cur=src==null?"":src;
  if(SS.mode==="naoshi"&&SS.nCleared.has(SS.idx))
    SS.cur=correctStr(curProb());
}
function gotoQuestion(j){
  if(j===SS.idx||j<0||j>=viewItems().length)return;
  if(SS.mode==="normal"&&SS.timeUp)return;
  // 終了済みのとき cur は空に戻されている。ここで saveCur すると、
  // 確定済みの最後の回答が空文字で上書きされて消えてしまう
  // (実測で確認した回答消去バグ。ver.20261118-13 で修正)
  if(!(SS.mode==="normal"&&SS.finished))saveCur();
  SS.idx=j;
  loadCur();
  if(SS.mode==="normal"){SS.finished=false;SS.elapsed=null;}
  $("status").textContent="";
  renderCalc();
}
function keyPress(k){
  if(!SS.items.length)return;
  if(k==="clear"){
    clearCur();paintInput();
    playSound("flash");
    SS.acCount+=1;
    if(SS.acCount>=5&&!SS.topVisible){
      SS.topVisible=true;
      const t=$("btnTop");if(t)t.classList.add("show");
    }
    return;
  }
  if(SS.mode==="normal"&&SS.finished){
    if(SS.timeUp)return;
    // 終了ラッチが立っていても、表示中の問題への入力は受け付けて
    // 編集を再開する (ver.20261118-22、PC版と同じ)。最後の問題で
    // OK の二度押し等により空のまま確定されると、採点が出ないまま
    // その場で直せなくなる。gotoQuestion が finished を解除する
    // 扱いに揃え、確定済みの答えをバッファに戻してから合流する。
    loadCur();SS.finished=false;SS.elapsed=null;
  }
  // 見た目の反応 (答え表示の更新) を先に確定させ、音は後から鳴らす
  if(isRem()){keyPressRem(k);paintInput();playSound("flash");return;}
  let t=SS.cur;
  if(k==="back"){t=t.slice(0,-1);SS.acCount=0;}
  else if(k==="minus"){
    if((!S.minus||SS.subject==="kaihou")&&SS.subject!=="quiz"){
      playSound("flash");return;}
    t=t.startsWith("-")?t.slice(1):"-"+t;SS.acCount=0;
  }
  else if(k==="."){
    // 開法で小数がオフのとき小数点は使えない
    if(SS.subject==="kaihou"&&!S.kaihou.dec_on){playSound("flash");return;}
    if(t.includes(".")){playSound("flash");return;}
    t=(t===""||t==="-")?t+"0.":t+".";SS.acCount=0;
  }
  else{
    // 開法の答え入力は整数部分+小数部分で最大10桁まで
    // (ver.20261118-29、ユーザー仕様)
    if(SS.subject==="kaihou"){
      if(kaihouInputDigits(t+k)>10){playSound("flash");return;}
    }
    else if(t.replace("-","").replace(".","").length>=18){playSound("flash");return;}
    t+=k;SS.acCount=0;
    $("status").textContent="";
  }
  SS.cur=t;
  paintInput();
  playSound("flash");
}
function clearCur(){
  if(isRem()){
    const [q,r]=remParts(SS.cur);const locks=curLocks();
    SS.cur=remJoin(locks.q?q:"",locks.r?r:"");
  }else SS.cur="";
}
function remLimits(){
  const p=curProb();
  const dv=p.divisor[0]<0n?-p.divisor[0]:p.divisor[0];
  return {qLim:S.div.qd,rLim:Math.max(1,(dv-1n).toString().length)};
}
// あまり入力: 商の桁数ぶん入ると、続きは あまり へ入る (マス計算と同じ単一欄)
function keyPressRem(k){
  let [q,r]=remParts(SS.cur);
  const locks=curLocks();
  const {qLim,rLim}=remLimits();
  const digs=s=>s.replace("-","").length;
  if(k==="back"){
    SS.acCount=0;
    if(!locks.r&&r)r=r.slice(0,-1);
    else if(!locks.q&&q)q=q.slice(0,-1);
    else return;
  }
  else if(k==="minus"){
    if(!S.minus||locks.q)return;
    q=q.startsWith("-")?q.slice(1):"-"+q;SS.acCount=0;
  }
  else if(/^[0-9]$/.test(k)){
    if(!locks.q&&digs(q)<qLim)q+=k;
    else if(!locks.r&&digs(r)<rLim)r+=k;
    else return;
    SS.acCount=0;$("status").textContent="";
  }
  else return;
  SS.cur=remJoin(q,r);
}
function okPress(){
  if(SS.mode==="naoshi"){okNaoshi();return;}
  if(SS.finished)return;
  saveCur();
  if(SS.idx>=SS.items.length-1){
    SS.finished=true;SS.completed=true;
    SS.elapsed=(Date.now()-SS.startTime)/1000;
    SS.cur="";
    renderCalc();return;
  }
  SS.idx+=1;loadCur();
  renderCalc();
}
function naoshiResetStr(p){
  if(!isRem())return "";
  const c=correctOf(p);const locks=curLocks();
  return remJoin(locks.q?c.q:"",locks.r?c.r:"");
}
function okNaoshi(){
  const p=curProb();
  if(judgeAns(p,SS.cur)){
    SS.nCleared.add(SS.idx);
    SS.nDrafts[SS.idx]=correctStr(p);
    $("status").textContent="";
    if(SS.nCleared.size>=SS.nItems.length){
      SS.naoshiCompleted=true;
      // なおし完答 → 答えあり画面へ進む (ver.20261118-37)
      showResultAns();return;
    }
    playSound("correct");
    for(let step=1;step<=SS.nItems.length;step++){
      const cand=(SS.idx+step)%SS.nItems.length;
      if(!SS.nCleared.has(cand)){SS.idx=cand;break;}
    }
    loadCur();
    renderCalc();
  }else{
    // あまり: 今回新しく合った部分があればその場でロックし、特別音で
    // 知らせる。両方とも間違い (新しいロックなし) は通常の不正解音
    let newLock=false;
    if(isRem()){
      const c=correctOf(p);const [q,r]=remParts(SS.cur);
      const L=SS.nLocks[SS.idx];
      if(L){
        if(eqV(parseV(q),parseV(c.q))&&!L.q){L.q=true;newLock=true;}
        if(eqV(parseV(r),parseV(c.r))&&!L.r){L.r=true;newLock=true;}
      }
    }
    playSound(newLock?"partial":"incorrect");
    // ロックした部分は残し、間違っている部分だけ入れ直し
    SS.cur=naoshiResetStr(p);
    SS.nDrafts[SS.idx]=SS.cur;
    renderCalc();
    $("status").textContent="ちがいます。もう一度！";
  }
}
function pressSaiten(){
  // 未回答 (空白) が残っているときは確認ポップアップを出す
  // (ver.20261118-23、ユーザー決定)。空白判定は表示中の問題の
  // 入力中バッファ (cur) も含めて行う。空白が無ければ即採点
  if(SS.mode==="normal"&&SS.items.length){
    const blanks=SS.items.some((_,i)=>{
      const a=(i===SS.idx&&!SS.finished)?SS.cur:SS.answers[i];
      return !ansFilled(a);
    });
    if(blanks){$("gradeModal").classList.add("show");return;}
  }
  doGrade();
}
function doGrade(){
  // 全問入力済みで採点へ来た場合 (finished ラッチが立っていない経路) も、
  // 終了として確定させてから結果へ進む
  if(SS.mode==="normal"&&!SS.finished){
    saveCur();
    SS.finished=true;
    if(SS.elapsed==null&&SS.startTime)
      SS.elapsed=(Date.now()-SS.startTime)/1000;
  }
  showResult();
}
// ---- 結果・なおし ----
function startNaoshi(){
  if(!SS.resultWrong.length)return;
  stopTimer();$("timerLabel").textContent="";
  SS.mode="naoshi";
  // 元のセット内に同じ問題が複数ある場合、なおしで同一問題が
  // 連続しないよう並べ替える (ver.20261118-37、Python版と同仕様)。
  // 対象は間違えた問題の集合そのままで、順序だけを変える
  const pkey=i=>probTextOf(SS.items[i],false)+"|"+correctStr(SS.items[i]);
  const pool=SS.resultWrong.slice();
  const orderedIdx=[];
  while(pool.length){
    let pick=0;
    if(orderedIdx.length){
      const last=pkey(orderedIdx[orderedIdx.length-1]);
      for(let k=0;k<pool.length;k++)
        if(pkey(pool[k])!==last){pick=k;break;}
    }
    orderedIdx.push(pool.splice(pick,1)[0]);
  }
  SS.nItems=orderedIdx.map(i=>({prob:SS.items[i],orig:i}));
  // あまり: 合っていた部分 (商/あまり) はロックして固定表示する
  SS.nLocks=SS.nItems.map(it=>{
    if(!isRem())return {q:false,r:false};
    const c=correctOf(it.prob);
    const [oq,orr]=remParts(SS.answers[it.orig]);
    return {q:eqV(parseV(oq),parseV(c.q)),r:eqV(parseV(orr),parseV(c.r))};
  });
  SS.nDrafts=SS.nItems.map((it,i)=>{
    if(!isRem())return "";
    const c=correctOf(it.prob);const L=SS.nLocks[i];
    return remJoin(L.q?c.q:"",L.r?c.r:"");
  });
  SS.nCleared=new Set();
  SS.idx=0;SS.cur=SS.nDrafts[0];
  SS.acCount=0;SS.topVisible=false;SS.tabsFor=null;
  $("status").textContent="";
  show("scr-calc");renderCalc();
  refitCalcSoon();
}
function showResult(){
  // 答えなし画面 (1回目の採点の結果)。正解は絶対に出さない
  // (ver.20261118-37、ユーザー指示: 2画面方式)
  buildResult(false);
}
function showResultAns(){
  // 答えあり画面。なおし完答・降参のあとに「次の画面」として進む
  buildResult(true);
}
function buildResult(withAns){
  stopTimer();
  if(SS.mode==="normal"&&!SS.resultRows){
    let score=0;const wrong=[];
    SS.resultRows=SS.items.map((p,i)=>{
      const ok=judgeAns(p,SS.answers[i]);
      if(ok)score++;else wrong.push(i);
      return {prob:p,ans:SS.answers[i],ok};
    });
    SS.resultScore=score;SS.resultWrong=wrong;
  }
  // 結果画面が出るときの終了音: 全問正解・なおし完了は正解音、
  // それ以外は合図音 (時間切れで結果へ行くときもここを通る)。
  // フォント切替などでの結果画面の再描画では鳴らさないよう、
  // 「セッション+得点+なおし完了」の組が変わったときだけ鳴らす
  const soundKey=SS.sessionSeq+"/"+SS.resultScore+"/"+SS.naoshiCompleted;
  if(SS._soundKey!==soundKey){
    SS._soundKey=soundKey;
    playSound(SS.naoshiCompleted||SS.resultScore>=SS.items.length
      ?"correct":"countdown");
  }
  SS.mode=withAns?"result_ans":"result";
  const suf=withAns?"Ans":"";
  $("scoreText"+suf).innerHTML=numWrap(SS.resultScore+"点／"+SS.items.length+"点");
  $("elapsedText"+suf).innerHTML=numWrap(formatElapsed(SS.elapsed||0));
  $("settingsText"+suf).innerHTML=numWrap(settingsSummary());
  const hasWrong=SS.resultWrong.length>0;
  if(!withAns){
    // なおしボタンは答えなし画面にだけ置く。降参したセッション
    // では出さない (ver.20261118-34)。「トップへ」だけが残る
    const showNao=hasWrong&&!SS.naoshiCompleted&&!SS.naoshiSurrendered;
    $("naoshiNote").style.display=showNao?"":"none";
    $("btnNaoshi").style.display=showNao?"":"none";
    $("doneNote").style.display="none";
  }else{
    // 答えあり画面にはなおしボタンを置かない (降参後の再入場
    // 不可 = -34 ルールの維持)
    $("doneNoteAns").style.display=SS.naoshiCompleted?"":"none";
  }
  // 正解の数値を出すかどうかは「どちらの画面か」で決まる
  // (ver.20261118-37 で2画面方式に変更)。答えなし画面では絶対に
  // 出さず、答えあり画面でのみ出す。自分の入力・赤文字・解説は
  // 両画面で従来どおり
  const showAns=withAns;
  const list=$(withAns?"resultListAns":"resultList");list.innerHTML="";
  const half=Math.ceil(SS.resultRows.length/2);
  SS.resultRows.forEach((r,i)=>{
    if(i===half&&SS.resultRows.length>4){
      const sep=mkEl("div","list-sep","- - - - - - - - - - - - - - - -");
      list.appendChild(sep);
    }
    const line=mkEl("div","list-line"+(r.ok?"":" wrong"));
    const probTxt=probTextOf(r.prob,showAns);
    let mine=r.ans;
    if(isRem()){
      const [mq,mr]=remParts(r.ans);
      mine=(mq===""&&mr==="")?"":commaStr(mq)+"..."+commaStr(mr);
    }else{
      mine=commaStr(mine);
    }
    line.innerHTML="";
    line.appendChild(mkEl("span","num",probTxt));
    line.appendChild(mkEl("span","sym"," = "));
    line.appendChild(mkEl("span","num",mine===""?"（未入力）":mine));
    if(!r.ok&&showAns){
      const c=correctOf(r.prob);
      const corr=isRem()?commaStr(c.q)+"..."+commaStr(c.r):commaStr(c.q);
      line.appendChild(mkEl("span","sym","　正解 "));
      line.appendChild(mkEl("span","num",corr));
    }
    if(SS.subject==="quiz"){
      // 法則クイズ: 数列 (□ は答えあり画面のときだけ埋める) と
      // 解説をセットで1ブロックにする
      const block=mkEl("div","quiz-res");
      block.appendChild(line);
      const ex=mkEl("div","quiz-explain");
      ex.innerHTML="解説: "+numWrap(r.prob.explain||"");
      block.appendChild(ex);
      list.appendChild(block);
    }else{
      list.appendChild(line);
    }
  });
  show(withAns?"scr-result-ans":"scr-result");
}
function probTextOf(p,fill){
  if(SS.subject==="quiz"){
    // 結果画面用: □ を正解で埋めるのは、正解を出す状態 (なおし
    // 完了後・降参後) のときだけ (ver.20261118-35)
    const s=p.seq.map((t,i)=>i===p.blank
      ?(fill?fmtVC([BigInt(p.answer[0]),0]):"□")
      :fmtVC([BigInt(t),0])).join("、");
    return (p.leadDots?"… ":"")+s+(p.trailDots?" …":"");
  }
  if(SS.subject==="mul")return fmtVC(p.a)+" × "+fmtVC(p.b);
  if(SS.subject==="kaihou")return (p.kind==="ritsu"?"³√":"√")+fmtVC(p.radicand);
  if(SS.subject==="div")return fmtVC(p.dividend)+" ÷ "+fmtVC(p.divisor);
  return p.operands.map((v,j)=>{
    let d=fmtVC([v[0]<0n?-v[0]:v[0],v[1]]);
    if(j>0)d=(v[0]<0n?"−":"+")+d;return d;
  }).join(" ");
}
$("btnSaiten").addEventListener("click",pressSaiten);
$("btnSurrender").addEventListener("click",()=>$("surrenderModal").classList.add("show"));
$("btnSurrenderNo").addEventListener("click",()=>$("surrenderModal").classList.remove("show"));
$("btnSurrenderYes").addEventListener("click",()=>{
  $("surrenderModal").classList.remove("show");
  // なおしを打ち切って答えあり画面へ進む。点数は採点時点のまま。
  // 一度降参したら、そのセッションではなおしに入り直せない
  // (ver.20261118-34、ユーザー指示。答えあり画面にはなおし
  // ボタンが無い)
  if(SS.mode==="naoshi"){SS.naoshiSurrendered=true;showResultAns();}
});
$("btnGradeNo").addEventListener("click",()=>$("gradeModal").classList.remove("show"));
$("btnGradeYes").addEventListener("click",()=>{
  $("gradeModal").classList.remove("show");
  // 空白は不正解としてそのまま採点する
  doGrade();
});
$("btnNaoshi").addEventListener("click",startNaoshi);
$("btnResultTop").addEventListener("click",()=>{SS.items=[];SS.mode="normal";show("scr-top");refreshTop();});
$("btnResultTopAns").addEventListener("click",()=>{SS.items=[];SS.mode="normal";show("scr-top");refreshTop();});
// ---- 物理キーボード ----
document.addEventListener("keydown",e=>{
  if(!$("scr-calc").classList.contains("active")||!SS.items.length)return;
  if(/^[0-9]$/.test(e.key)){keyPress(e.key);e.preventDefault();return;}
  if(e.key==="Backspace"){keyPress("back");e.preventDefault();return;}
  if(e.key==="Enter"){okPress();e.preventDefault();return;}
  if(e.key==="."){keyPress(".");e.preventDefault();return;}
  if(e.key==="-"){keyPress("minus");e.preventDefault();}
});
</script>

<script>
"use strict";
/* ================================================================
   ドラッグスクロール + 矢印キーナビ + Esc (全アプリ共通方式)
   ================================================================ */
function makeDragScroll(elm){
  if(!elm)return;
  let down=false,moved=false,sx=0,sy=0,st=0,sl=0;
  elm.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="mouse"||e.button!==0)return;
    down=true;moved=false;sx=e.clientX;sy=e.clientY;st=elm.scrollTop;sl=elm.scrollLeft;
  });
  elm.addEventListener("pointermove",e=>{
    if(!down)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;elm.scrollTop=st-dy;elm.scrollLeft=sl-dx;
  });
  const end=()=>{down=false;};
  elm.addEventListener("pointerup",end);
  elm.addEventListener("pointercancel",end);
  elm.addEventListener("click",e=>{
    if(moved){e.stopPropagation();e.preventDefault();moved=false;}
  },true);
}
function makeWindowDragScroll(elm){
  let down=false,moved=false,sy=0,st=0;
  elm.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="mouse"||e.button!==0)return;
    if(e.target.closest("button, input, select, textarea, a"))return;
    const sc=e.target.closest("#resultList, #tabs");
    if(sc&&(sc.scrollHeight>sc.clientHeight+1||sc.scrollWidth>sc.clientWidth+1))return;
    down=true;moved=false;sy=e.clientY;st=window.scrollY;
  });
  elm.addEventListener("pointermove",e=>{
    if(!down)return;
    const dy=e.clientY-sy;
    if(!moved&&Math.abs(dy)<6)return;
    moved=true;window.scrollTo(window.scrollX,st-dy);
  });
  const end=()=>{down=false;};
  elm.addEventListener("pointerup",end);
  elm.addEventListener("pointercancel",end);
  elm.addEventListener("click",e=>{
    if(moved){e.stopPropagation();e.preventDefault();moved=false;}
  },true);
}
makeDragScroll(document.getElementById("resultList"));
makeDragScroll(document.getElementById("resultListAns"));
makeDragScroll(document.getElementById("tabs"));
document.querySelectorAll(".screen").forEach(makeWindowDragScroll);

const NAV_SCREEN_IDS=["scr-top","scr-settings","scr-beginner","scr-result","scr-result-ans","scr-end"];
let kbEl=null;
function navTargets(){
  const scr=document.querySelector(".screen.active");
  if(!scr||NAV_SCREEN_IDS.indexOf(scr.id)<0)return [];
  return Array.prototype.filter.call(scr.querySelectorAll("button"),b=>
    b.offsetParent!==null&&!b.disabled&&!b.classList.contains("step-btn")&&b.id!=="btnFsExit");
}
function setKbFocus(elm){
  if(kbEl)kbEl.classList.remove("kb-focus");
  kbEl=elm||null;
  if(kbEl)kbEl.classList.add("kb-focus");
}
function kbInit(){
  const t=navTargets();
  if(!t.length){setKbFocus(null);return;}
  const scr=document.querySelector(".screen.active");
  let elm=t[0];
  if(scr.id==="scr-top"&&$("tile-mul"))elm=$("tile-mul");
  if(scr.id==="scr-settings"&&$("btnStart"))elm=$("btnStart");
  if(scr.id==="scr-result"){
    const nb=$("btnNaoshi");
    elm=(nb&&nb.offsetParent!==null&&nb.style.display!=="none")?nb:($("btnResultTop")||elm);
  }
  if(scr.id==="scr-result-ans")elm=$("btnResultTopAns")||elm;
  setKbFocus(elm);
}
function kbMove(dir){
  const t=navTargets();
  if(!t.length)return;
  if(!kbEl||t.indexOf(kbEl)<0){setKbFocus(t[0]);return;}
  const c=kbEl.getBoundingClientRect();
  const cx=c.left+c.width/2,cy=c.top+c.height/2;
  let best=null,bs=Infinity;
  t.forEach(elm=>{
    if(elm===kbEl)return;
    const r=elm.getBoundingClientRect();
    const dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
    if(dir==="Right"&&dx<=4)return;
    if(dir==="Left"&&dx>=-4)return;
    if(dir==="Down"&&dy<=4)return;
    if(dir==="Up"&&dy>=-4)return;
    const sc=(dir==="Left"||dir==="Right")?Math.abs(dx)+3*Math.abs(dy):Math.abs(dy)+3*Math.abs(dx);
    if(sc<bs){bs=sc;best=elm;}
  });
  if(best){setKbFocus(best);try{best.focus({preventScroll:true});}catch(e){}}
}
document.addEventListener("keydown",e=>{
  const scr=document.querySelector(".screen.active");
  if(!scr||NAV_SCREEN_IDS.indexOf(scr.id)<0)return;
  if(e.key&&e.key.indexOf("Arrow")===0){e.preventDefault();kbMove(e.key.slice(5));}
  else if(e.key==="Enter"){
    if(kbEl&&navTargets().indexOf(kbEl)>=0){e.preventDefault();kbEl.click();}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(document.fullscreenElement)return;
  const qm=$("quitModal");
  if(qm&&qm.classList.contains("show")){$("btnQuitNo").click();return;}
  const sm=$("surrenderModal");
  if(sm&&sm.classList.contains("show")){$("btnSurrenderNo").click();return;}
  const gm=$("gradeModal");
  if(gm&&gm.classList.contains("show")){$("btnGradeNo").click();return;}
  const scr=document.querySelector(".screen.active");
  if(!scr)return;
  if(scr.id==="scr-calc"){
    stopTimer();
    if(SS.mode==="naoshi"||SS.mode==="result")showResult();
    else{SS.items=[];showSettings(curSubject);}
  }else if(scr.id==="scr-count"){
    cancelCountdown();showSettings(curSubject);
  }else if(scr.id==="scr-settings"||scr.id==="scr-result"||scr.id==="scr-result-ans"||scr.id==="scr-end"){
    SS.items=[];show("scr-top");refreshTop();
  }else if(scr.id==="scr-beginner"){
    showSettings("mitori");
  }
});
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest?e.target.closest("button"):null;
  if(!b)return;
  if(navTargets().indexOf(b)>=0)setKbFocus(b);
  else setKbFocus(null);
},true);

window.__KC={S:S,SS:SS,

  fitButtonText:fitButtonText,openKouDock:openKouDock,
